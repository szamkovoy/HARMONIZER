      connectedIdle: "Verbonden. Kies een oefening in de app.",
      starting: "Video starten op de TV...",
      playing: "Video speelt",
      paused: "Pauze",
      expired: "Sessie verlopen. Vernieuw de pagina voor een nieuwe code.",
      closed: "Sessie gesloten. Vernieuw de pagina voor een nieuwe code.",
      unavailable: "Weergave op afstand is niet beschikbaar.",
      codeError: "Kon geen unieke code maken. Vernieuw de pagina.",
      vimeoDenied: "Vimeo weigerde afspelen.",
      vimeoCheckPrivacy: "Controleer Privacy / Embed domains voor deze Vimeo-video.",
      playerAriaLabel: "Videospeler",
    },
  };
  const SUPPORTED = ["ru", "en", "de", "fr", "it", "es", "pt", "nl"];
  // Browser language decides the TV page UI. If detection fails or the browser
  // language is not one of the supported app locales, fall back to English.
  function pickLocale(value) {
    const prefix = String(value ?? "").trim().slice(0, 2).toLowerCase();
    return SUPPORTED.includes(prefix) ? prefix : "en";
  }
  function detectLocale() {
    const nav = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    return pickLocale(nav);
  }
  function stringsFor(locale) {
    return STRINGS[locale] || STRINGS.en;
  }

  let currentLocale = detectLocale();
  function t(key) {
    return stringsFor(currentLocale)[key];
  }
  function renderStatic() {
    eyebrowEl.textContent = `${t("appName")} ${t("remotePlay")}`;
    playerEl.setAttribute("aria-label", t("playerAriaLabel"));
  }

  // ---- Remote Play wiring. -------------------------------------------------
  const codeEl = document.getElementById("hrp-code");
  const statusEl = document.getElementById("hrp-status");
  const playerEl = document.getElementById("hrp-player");
  const eyebrowEl = document.getElementById("hrp-eyebrow");
  // ---- Custom on-screen controls (Vimeo's own are hidden via controls=0 +
  // setControlsEnabled(false)). Wired once here so repeated mount/destroy of
  // the iframe doesn't stack duplicate listeners. Each handler reads the
  // current `player`/`iframe` at call time.
  const muteBtn = document.getElementById("hrp-mute");
  const volumeSlider = document.getElementById("hrp-volume");
  const qualityBtn = document.getElementById("hrp-quality");
  const fsBtn = document.getElementById("hrp-fullscreen");
  const unmuteOverlay = document.getElementById("hrp-unmute");

  function setMuteIcon(muted) {
    if (muteBtn) muteBtn.textContent = muted ? "\u{1F507}" : "\u{1F50A}";
  }
  function showUnmuteOverlay(show) {
    if (unmuteOverlay) unmuteOverlay.classList.toggle("hrp-hidden", !show);
  }
  async function applyUnmute() {
    if (!player) return;
    try {
      await player.setMuted(false).catch(() => {});
      const v = parseFloat(volumeSlider && volumeSlider.value) || 1;
      if (v > 0) await player.setVolume(v).catch(() => {});
      setMuteIcon(false);
      showUnmuteOverlay(false);
    } catch { /* ignore */ }
  }
  if (muteBtn) {
    muteBtn.addEventListener("click", async () => {
      if (!player) return;
      const muted = await player.getMuted().catch(() => false);
      if (muted) {
        await applyUnmute();
      } else {
        await player.setMuted(true).catch(() => {});
        setMuteIcon(true);
        showUnmuteOverlay(true);
      }
    });
  }
  if (unmuteOverlay) {
    unmuteOverlay.addEventListener("click", applyUnmute);
  }
  if (volumeSlider) {
    volumeSlider.addEventListener("input", async (e) => {
      if (!player) return;
      const v = parseFloat(e.target.value) || 0;
      await player.setVolume(v).catch(() => {});
      if (v > 0) {
        await player.setMuted(false).catch(() => {});
        setMuteIcon(false);
        showUnmuteOverlay(false);
      } else {
        await player.setMuted(true).catch(() => {});
        setMuteIcon(true);
      }
    });
  }
  if (qualityBtn) {
    qualityBtn.addEventListener("click", async () => {
      if (!player) return;
      try {
        const qs = await player.getQualities().catch(() => []);
        if (!qs || !qs.length) return;
        const cur = await player.getCurrentQuality().catch(() => null);
        const idx = qs.findIndex((q) => q.id === cur);
        const next = qs[(idx + 1) % qs.length];
        await player.setCurrentQuality(next.id).catch(() => {});
        qualityBtn.textContent = shortQualityLabel(next.label || next.id);
      } catch { /* ignore */ }
    });
  }
  function shortQualityLabel(label) {
    if (!label) return "HD";
    const m = String(label).match(/\d{3,4}p?/i);
    return m ? m[0].replace(/p$/i, "") + "p" : String(label);
  }
  if (fsBtn) {
    fsBtn.addEventListener("click", () => {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        return;
      }
      const target = playerEl;
      if (target && target.requestFullscreen) target.requestFullscreen().catch(() => {});
      else if (target && target.webkitRequestFullscreen) target.webkitRequestFullscreen();
    });
    document.addEventListener("fullscreenchange", () => {
      fsBtn.textContent = document.fullscreenElement ? "\u2715" : "\u{26F6}";
    });
    document.addEventListener("webkitfullscreenchange", () => {
      fsBtn.textContent = document.webkitFullscreenElement ? "\u2715" : "\u{26F6}";
    });
  }
  const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  // Fallback audio track when the mobile client did not write `audiotrack` on
  // the session row (legacy rows / anonymous waiting sessions). The mobile
  // client normally writes "ru" or "en" based on the active app locale.
  const VIMEO_AUDIO_TRACK = "ru";

  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    realtime: { params: { eventsPerSecond: 3 } },
  });

  let session = null;
  let channel = null;
  let player = null;
  let pollTimer = null;
  let lastVideoKey = null;
  let lastPlayerError = "";

  let lastStatusText = "";
  let lastConnectedClass = false;
  let lastFingerprint = "";
  let applyChain = Promise.resolve();

  renderStatic();

  function setStatusStable(text, connected = false) {
    if (text === lastStatusText && connected === lastConnectedClass) return;
    lastStatusText = text;
    lastConnectedClass = connected;
    statusEl.textContent = text;
    statusEl.classList.toggle("hrp-connected", connected);
  }

  function fingerprint(row) {
    return [row.id, row.status, row.vimeo_id ?? "", row.audiotrack ?? "", row.user_id ?? "", row.expires_at].join("\u001f");
  }

  function enqueueApply(next) {
    applyChain = applyChain.then(() => applySessionCore(next)).catch(() => {});
  }

  function randomCode() {
    return Array.from({ length: 4 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join("");
  }

  const SESSION_ID_KEY = "hrp_session_id";

  async function createSession() {
    for (let attempt = 0; attempt < 6; attempt += 1) {
      const pairing_code = randomCode();
      const { data, error } = await client
        .from("tv_sessions")
        .insert({ pairing_code })
        .select("id,pairing_code,vimeo_id,audiotrack,status,user_id,expires_at")
        .single();

      if (!error && data) return data;
      if (!String(error && error.message).includes("duplicate key")) throw error;
    }
    throw new Error(t("codeError"));
  }

  // Reuse the same tv_sessions row when the user reloads /tv/ in the same browser
  // profile (sessionStorage). A brand-new visit still creates a fresh pairing code.
  async function restoreOrCreateSession() {
    try {
      const storedId = sessionStorage.getItem(SESSION_ID_KEY);
      if (storedId) {
        const { data, error } = await client
          .from("tv_sessions")
          .select("id,pairing_code,vimeo_id,audiotrack,status,user_id,expires_at")
          .eq("id", storedId)
          .maybeSingle();
        if (
          !error &&
          data &&
          data.status !== "closed" &&
          new Date(data.expires_at).getTime() > Date.now()
        ) {
          return data;
        }
        sessionStorage.removeItem(SESSION_ID_KEY);
      }
    } catch {
      /* sessionStorage may be unavailable in some embedded browsers */
    }
    const created = await createSession();
    try {
      sessionStorage.setItem(SESSION_ID_KEY, created.id);
    } catch {
      /* ignore */
    }
    return created;
  }

  function vimeoEmbedUrl(vimeoId, audiotrack) {
    const track = (audiotrack && String(audiotrack).trim()) || VIMEO_AUDIO_TRACK;
    // controls=0 hides Vimeo's play/pause/scrub/volume UI — playback is driven
    // solely from the phone remote (autoplay on mount). The only on-screen
    // control the user gets is the custom fullscreen button (#hrp-fullscreen).
    return `https://player.vimeo.com/video/${encodeURIComponent(vimeoId)}?audiotrack=${encodeURIComponent(track)}&controls=0`;
  }

  async function destroyPlayer() {
    try {
      if (player && typeof player.destroy === "function") {
        await player.destroy().catch(() => {});
      }
    } finally {
      player = null;
      lastVideoKey = null;
      lastPlayerError = "";
      // Remove only the iframe(s), keep the custom controls + unmute overlay.
      Array.from(playerEl.querySelectorAll("iframe")).forEach((el) => el.remove());
      showUnmuteOverlay(false);
      await sleep(220);
    }
  }

  async function mountPlayerIfNeeded(vimeoId, audiotrack) {
    if (!vimeoId) return false;
    const wantKey = `${vimeoId}|${(audiotrack && String(audiotrack).trim()) || VIMEO_AUDIO_TRACK}`;
    if (player && lastVideoKey === wantKey) return !lastPlayerError;

    await destroyPlayer();
    const iframe = document.createElement("iframe");
    iframe.src = vimeoEmbedUrl(vimeoId, audiotrack);
    iframe.setAttribute("width", "640");
    iframe.setAttribute("height", "360");
    iframe.setAttribute("title", `Vimeo ${vimeoId}`);
    iframe.setAttribute("allow", "autoplay; fullscreen");
    iframe.setAttribute("allowfullscreen", "");
    iframe.setAttribute("frameborder", "0");
    playerEl.appendChild(iframe);
    player = new Vimeo.Player(iframe);
    lastVideoKey = wantKey;
    player.on("error", (error) => {
      lastPlayerError = error && error.message ? error.message : t("vimeoDenied");
      setStatusStable(`${t("vimeoDenied")} ${lastPlayerError}`, true);
    });
    // Hide all Vimeo on-screen controls (play/pause/scrubber/volume/fullscreen)
    // — playback is driven solely from the phone remote. We use BOTH the
    // `controls=0` URL param AND the programmatic API as a belt-and-suspenders
    // approach (the URL param alone is sometimes ignored depending on the
    // Vimeo account's player preferences). The custom #hrp-fullscreen button
    // remains the only on-screen control.
    player.on("play", () => { if (!applyingRemoteStatus) patchStatus("playing"); });
    player.on("pause", () => { if (!applyingRemoteStatus) patchStatus("paused"); });
    player.on("ended", () => { if (!applyingRemoteStatus) patchStatus("stopped"); });
    try {
      await player.ready();
      if (lastPlayerError) return false;
      // Programmatically disable Vimeo's own controls (more reliable than the
      // URL param) — playback is driven from the phone remote + our custom bar.
      try { await player.setControlsEnabled(false).catch(() => {}); } catch { /* optional */ }
      // Try to set the highest available quality (user requested max resolution).
      try {
        const qs = await player.getQualities().catch(() => []);
        const best = (qs || []).find((q) => q.id !== "auto") || null;
        if (best) await player.setCurrentQuality(best.id).catch(() => {});
        if (qualityBtn) {
          const cur = await player.getCurrentQuality().catch(() => null);
          const curQ = (qs || []).find((q) => q.id === cur);
          qualityBtn.textContent = shortQualityLabel(curQ ? curQ.label : cur);
        }
      } catch { /* quality API optional */ }
      // Try unmuted autoplay first; browsers block autoplay-with-sound without a
      // prior user gesture, so fall back to muted + a "tap to unmute" overlay.
      try {
        await player.setMuted(false).catch(() => {});
        await player.play();
        setMuteIcon(false);
        showUnmuteOverlay(false);
      } catch {
        await player.setMuted(true).catch(() => {});
        await player.play().catch((error) => {
          lastPlayerError = error && error.message ? error.message : "";
        });
        setMuteIcon(true);
        showUnmuteOverlay(true);
      }
      return !lastPlayerError;
    } catch {
      lastPlayerError = t("vimeoCheckPrivacy");
      setStatusStable(`${t("vimeoDenied")} ${lastPlayerError}`, true);
      return false;
    }
  }

  // PATCH tv_sessions.status from a browser-side Vimeo event. Best-effort;
  // ignored while we're applying a remote status change (loop guard).
  let applyingRemoteStatus = false;
  async function patchStatus(nextStatus) {
    if (!session || session.status === nextStatus) return;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/tv_sessions?id=eq.${session.id}`, {
        method: "PATCH",
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json",
          Prefer: "return=minimal",
        },
        body: JSON.stringify({ status: nextStatus }),
      }).catch(() => null);
      if (res && !res.ok) { /* ignore — best-effort */ }
    } catch { /* ignore */ }
  }

  async function applySessionCore(next) {
    if (!next) return;
    const fp = fingerprint(next);
    if (fp === lastFingerprint) return;

    session = next;
    const connected = Boolean(next.user_id);

    if (next.status === "closed" || new Date(next.expires_at).getTime() <= Date.now()) {
      lastFingerprint = fp;
      setStatusStable(t("expired"), false);
      await destroyPlayer();
      return;
    }

    if (next.status === "stopped") {
      lastFingerprint = fp;
      await destroyPlayer();
      setStatusStable(connected ? t("connectedIdle") : t("waitConnection"), connected);
      return;
    }

    if (next.status === "playing" && next.vimeo_id) {
      const wantKey = `${next.vimeo_id}|${(next.audiotrack && String(next.audiotrack).trim()) || VIMEO_AUDIO_TRACK}`;
      const already = player && lastVideoKey === wantKey;
      if (!already) setStatusStable(t("starting"), true);
      const mounted = await mountPlayerIfNeeded(next.vimeo_id, next.audiotrack);
      if (!mounted) {
        lastFingerprint = fp;
        return;
      }
      if (!player || lastVideoKey !== wantKey) return;
      if (already) {
        applyingRemoteStatus = true;
        try { await player.play().catch(() => {}); } finally { applyingRemoteStatus = false; }
      }
      lastFingerprint = fp;
      setStatusStable(t("playing"), true);
      return;
    }

    if (next.status === "paused" && next.vimeo_id) {
      const wantKey = `${next.vimeo_id}|${(next.audiotrack && String(next.audiotrack).trim()) || VIMEO_AUDIO_TRACK}`;
      const mounted = await mountPlayerIfNeeded(next.vimeo_id, next.audiotrack);
      if (!mounted) {
        lastFingerprint = fp;
        return;
      }
      if (!player || lastVideoKey !== wantKey) return;
      lastFingerprint = fp;
      setStatusStable(t("paused"), true);
      applyingRemoteStatus = true;
      try { if (player) await player.pause().catch(() => {}); } finally { applyingRemoteStatus = false; }
      return;
    }

    lastFingerprint = fp;
    if (!connected) {
      setStatusStable(t("waitConnection"), false);
      return;
    }
    if (!next.vimeo_id) {
      await destroyPlayer();
      setStatusStable(t("connectedIdle"), true);
    }
  }

  async function closeSession() {
    if (!session || session.status === "closed") return;
    // Keep the pairing alive (status "stopped") so the phone remote can offer
    // "Replay" after the tab is closed, and sessionStorage can restore the same
    // code on reload. "closed" is reserved for explicit unlink / stale cleanup.
    await fetch(`${SUPABASE_URL}/rest/v1/tv_sessions?id=eq.${session.id}`, {
      method: "PATCH",
      keepalive: true,
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        Prefer: "return=minimal",
      },
      body: JSON.stringify({ status: "stopped" }),
    }).catch(() => {});
  }

  async function fetchLatestSession() {
    if (!session || !session.id) return;
    const { data, error } = await client
      .from("tv_sessions")
      .select("id,pairing_code,vimeo_id,audiotrack,status,user_id,expires_at")
      .eq("id", session.id)
      .maybeSingle();
    if (!error && data) enqueueApply(data);
  }

  function startPolling() {
    if (pollTimer) window.clearInterval(pollTimer);
    pollTimer = window.setInterval(fetchLatestSession, 2000);
  }

  async function start() {
    try {
      session = await restoreOrCreateSession();
      codeEl.textContent = session.pairing_code;
      lastStatusText = "";
      lastConnectedClass = false;
      setStatusStable(t("waitConnection"), false);

      channel = client
        .channel(`tv-session-${session.id}`)
        .on("postgres_changes", {
          event: "*",
          schema: "public",
          table: "tv_sessions",
          filter: `id=eq.${session.id}`,
        }, (payload) => {
          if (payload.eventType === "DELETE") {
            lastFingerprint = "";
            setStatusStable(t("closed"), false);
            return;
          }
          enqueueApply(payload.new);
        })
        .subscribe();

      startPolling();
    } catch (error) {
      lastStatusText = "";
      setStatusStable(error && error.message ? error.message : t("unavailable"), false);
    }
  }

  window.addEventListener("beforeunload", closeSession);
  window.addEventListener("pagehide", closeSession);
  window.addEventListener("focus", fetchLatestSession);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) fetchLatestSession();
  });
  start();
})();
</script>
