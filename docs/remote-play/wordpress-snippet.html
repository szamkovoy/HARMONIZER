  // ---- i18n: only the resource strings differ per locale. ------------------

      playerAriaLabel: "Видеоплеер",
    },
    en: {

    },

      closed: "Sitzung geschlossen. Aktualisieren Sie die Seite für einen neuen Code.",
      unavailable: "Fernwiedergabe ist nicht verfügbar.",
      codeError: "Eindeutiger Code konnte nicht erstellt werden. Aktualisieren Sie die Seite.",

      vimeoCheckPrivacy: "Prüfen Sie Privacy / Embed domains für dieses Vimeo-Video.",
      playerAriaLabel: "Videoplayer",
    },
    fr: {

      remotePlay: "Lecture à distance",
      creatingCode: "Création du code de connexion...",
      waitConnection: "En attente de connexion depuis l'application",
      connectedIdle: "Connecté. Choisissez une pratique dans l'application.",
      starting: "Démarrage de la vidéo sur la TV...",
      playing: "Vidéo en cours",
      paused: "Pause",
      expired: "Session expirée. Actualisez la page pour obtenir un nouveau code.",
      closed: "Session fermée. Actualisez la page pour obtenir un nouveau code.",
      unavailable: "Lecture à distance est indisponible.",
      codeError: "Impossible de créer un code unique. Actualisez la page.",
      vimeoDenied: "Vimeo a refusé la lecture.",
      vimeoCheckPrivacy: "Vérifiez Privacy / Embed domains pour cette vidéo Vimeo.",
      playerAriaLabel: "Lecteur vidéo",
    },
    it: {

      remotePlay: "Riproduzione remota",
      creatingCode: "Creazione del codice di connessione...",
      waitConnection: "In attesa di connessione dall'app",
      connectedIdle: "Connesso. Scegli una pratica nell'app.",
      starting: "Avvio del video sulla TV...",
      playing: "Video in riproduzione",
      paused: "Pausa",
      expired: "Sessione scaduta. Aggiorna la pagina per un nuovo codice.",
      closed: "Sessione chiusa. Aggiorna la pagina per un nuovo codice.",
      unavailable: "Riproduzione remota non disponibile.",
      codeError: "Impossibile creare un codice univoco. Aggiorna la pagina.",
      vimeoDenied: "Vimeo ha rifiutato la riproduzione.",
      vimeoCheckPrivacy: "Verifica Privacy / Embed domains per questo video Vimeo.",
      playerAriaLabel: "Lettore video",
    },
    es: {
      appName: "Armonizador",
      remotePlay: "Reproducción remota",
      creatingCode: "Creando código de conexión...",
      waitConnection: "Esperando la conexión desde la app",
      connectedIdle: "Conectado. Elige una práctica en la app.",
      starting: "Iniciando vídeo en la TV...",
      playing: "Vídeo en reproducción",
      paused: "Pausa",
      expired: "Sesión caducada. Actualiza la página para un nuevo código.",
      closed: "Sesión cerrada. Actualiza la página para un nuevo código.",
      unavailable: "Reproducción remota no disponible.",
      codeError: "No se pudo crear un código único. Actualiza la página.",
      vimeoDenied: "Vimeo rechazó la reproducción.",
      vimeoCheckPrivacy: "Verifica Privacy / Embed domains para este vídeo de Vimeo.",
      playerAriaLabel: "Reproductor de vídeo",
    },
    pt: {
      appName: "Harmonizador",
      remotePlay: "Reprodução remota",
      creatingCode: "Criando código de conexão...",
      waitConnection: "Aguardando conexão do app",
      connectedIdle: "Conectado. Escolha uma prática no app.",
      starting: "Iniciando o vídeo na TV...",
      playing: "Vídeo em reprodução",
      paused: "Pausa",
      expired: "Sessão expirada. Atualize a página para um novo código.",
      closed: "Sessão encerrada. Atualize a página para um novo código.",
      unavailable: "Reprodução remota indisponível.",
      codeError: "Não foi possível criar um código único. Atualize a página.",
      vimeoDenied: "Vimeo recusou a reprodução.",
      vimeoCheckPrivacy: "Verifique Privacy / Embed domains deste vídeo do Vimeo.",
      playerAriaLabel: "Reprodutor de vídeo",
    },
    nl: {
      appName: "Harmoniseerder",
      remotePlay: "Weergave op afstand",
      creatingCode: "Verbindingscode maken...",
      waitConnection: "Wachten op verbinding vanuit de app",
      connectedIdle: "Verbonden. Kies een oefening in de app.",
      starting: "Video starten op de TV...",
      playing: "Video speelt",
      paused: "Pauze",
      expired: "Sessie verlopen. Vernieuw de pagina voor een nieuwe code.",
      closed: "Sessie gesloten. Vernieuw de pagina voor een nieuwe code.",
      unavailable: "Weergave op afstand is niet beschikbaar.",
      codeError: "Kon geen unieke code maken. Vernieuw de pagina.",
      vimeoDenied: "Vimeo weigerde afspelen.",
      vimeoCheckPrivacy: "Controleer Privacy / Embed domains voor deze Vimeo-video.",
      playerAriaLabel: "Videospeler",
    },
  };
  const SUPPORTED = ["ru", "en", "de", "fr", "it", "es", "pt", "nl"];
  // Browser language decides the TV page UI. If detection fails or the browser
  // language is not one of the supported app locales, fall back to English.
  function pickLocale(value) {
    const prefix = String(value ?? "").trim().slice(0, 2).toLowerCase();
    return SUPPORTED.includes(prefix) ? prefix : "en";
  }
  function detectLocale() {
    const nav = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    return pickLocale(nav);
  }
  function stringsFor(locale) {
    return STRINGS[locale] || STRINGS.en;
  }

  let currentLocale = detectLocale();
  function t(key) {
    return stringsFor(currentLocale)[key];
  }
  function renderStatic() {
    eyebrowEl.textContent = `${t("appName")} ${t("remotePlay")}`;
    playerEl.setAttribute("aria-label", t("playerAriaLabel"));
  }

  // ---- Remote Play wiring. -------------------------------------------------
  const codeEl = document.getElementById("hrp-code");
  const statusEl = document.getElementById("hrp-status");
  const playerEl = document.getElementById("hrp-player");
  const eyebrowEl = document.getElementById("hrp-eyebrow");
  const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  // Fallback audio track when the mobile client did not write `audiotrack` on
  // the session row (legacy rows / anonymous waiting sessions). The mobile
  // client normally writes "ru" or "en" based on the active app locale.
  const VIMEO_AUDIO_TRACK = "ru";

  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    realtime: { params: { eventsPerSecond: 3 } },
  });

  let session = null;
  let channel = null;
  let player = null;
  let pollTimer = null;
  let lastVideoKey = null;
  let lastPlayerError = "";

  let lastStatusText = "";
  let lastConnectedClass = false;
  let lastFingerprint = "";
  let applyChain = Promise.resolve();

  renderStatic();

  function setStatusStable(text, connected = false) {
    if (text === lastStatusText && connected === lastConnectedClass) return;
    lastStatusText = text;
    lastConnectedClass = connected;
    statusEl.textContent = text;
    statusEl.classList.toggle("hrp-connected", connected);
  }

  function fingerprint(row) {
    return [row.id, row.status, row.vimeo_id ?? "", row.audiotrack ?? "", row.user_id ?? "", row.expires_at].join("\u001f");
  }

  function enqueueApply(next) {
    applyChain = applyChain.then(() => applySessionCore(next)).catch(() => {});
  }

  function randomCode() {
    return Array.from({ length: 4 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join("");
  }

  async function createSession() {
    for (let attempt = 0; attempt < 6; attempt += 1) {
      const pairing_code = randomCode();
      const { data, error } = await client
        .from("tv_sessions")
        .insert({ pairing_code })
        .select("id,pairing_code,vimeo_id,audiotrack,status,user_id,expires_at")
        .single();

      if (!error && data) return data;
      if (!String(error && error.message).includes("duplicate key")) throw error;
    }
    throw new Error(t("codeError"));
  }

  function vimeoEmbedUrl(vimeoId, audiotrack) {
    const track = (audiotrack && String(audiotrack).trim()) || VIMEO_AUDIO_TRACK;
    return `https://player.vimeo.com/video/${encodeURIComponent(vimeoId)}?audiotrack=${encodeURIComponent(track)}`;
  }

  async function destroyPlayer() {
    try {
      if (player && typeof player.destroy === "function") {
        await player.destroy().catch(() => {});
      }
    } finally {
      player = null;
      lastVideoKey = null;
      lastPlayerError = "";
      playerEl.innerHTML = "";
      await sleep(220);
    }
  }

  async function mountPlayerIfNeeded(vimeoId, audiotrack) {
    if (!vimeoId) return false;
    const wantKey = `${vimeoId}|${(audiotrack && String(audiotrack).trim()) || VIMEO_AUDIO_TRACK}`;
    if (player && lastVideoKey === wantKey) return !lastPlayerError;

    await destroyPlayer();
    const iframe = document.createElement("iframe");
    iframe.src = vimeoEmbedUrl(vimeoId, audiotrack);
    iframe.setAttribute("width", "640");
    iframe.setAttribute("height", "360");
    iframe.setAttribute("title", `Vimeo ${vimeoId}`);
    iframe.setAttribute("allow", "autoplay; fullscreen");
    iframe.setAttribute("allowfullscreen", "");
    iframe.setAttribute("frameborder", "0");
    playerEl.appendChild(iframe);
    player = new Vimeo.Player(iframe);
    lastVideoKey = wantKey;
    player.on("error", (error) => {
      lastPlayerError = error && error.message ? error.message : t("vimeoDenied");
      setStatusStable(`${t("vimeoDenied")} ${lastPlayerError}`, true);
    });
    try {
      await player.ready();
      if (lastPlayerError) return false;
      await player.play().catch((error) => {
        lastPlayerError = error && error.message ? error.message : "";
      });
      iframe?.requestFullscreen?.().catch(() => {});
      return !lastPlayerError;
    } catch {
      lastPlayerError = t("vimeoCheckPrivacy");
      setStatusStable(`${t("vimeoDenied")} ${lastPlayerError}`, true);
      return false;
    }
  }

  async function applySessionCore(next) {
    if (!next) return;
    const fp = fingerprint(next);
    if (fp === lastFingerprint) return;

    session = next;
    const connected = Boolean(next.user_id);

    if (next.status === "closed" || new Date(next.expires_at).getTime() <= Date.now()) {
      lastFingerprint = fp;
      setStatusStable(t("expired"), false);
      await destroyPlayer();
      return;
    }

    if (next.status === "stopped") {
      lastFingerprint = fp;
      await destroyPlayer();
      setStatusStable(connected ? t("connectedIdle") : t("waitConnection"), connected);
      return;
    }

    if (next.status === "playing" && next.vimeo_id) {
      const wantKey = `${next.vimeo_id}|${(next.audiotrack && String(next.audiotrack).trim()) || VIMEO_AUDIO_TRACK}`;
      const already = player && lastVideoKey === wantKey;
      if (!already) setStatusStable(t("starting"), true);
      const mounted = await mountPlayerIfNeeded(next.vimeo_id, next.audiotrack);
      if (!mounted) {
        lastFingerprint = fp;
        return;
      }
      if (!player || lastVideoKey !== wantKey) return;
      if (already) await player.play().catch(() => {});
      lastFingerprint = fp;
      setStatusStable(t("playing"), true);
      return;
    }

    if (next.status === "paused" && next.vimeo_id) {
      const wantKey = `${next.vimeo_id}|${(next.audiotrack && String(next.audiotrack).trim()) || VIMEO_AUDIO_TRACK}`;
      const mounted = await mountPlayerIfNeeded(next.vimeo_id, next.audiotrack);
      if (!mounted) {
        lastFingerprint = fp;
        return;
      }
      if (!player || lastVideoKey !== wantKey) return;
      lastFingerprint = fp;
      setStatusStable(t("paused"), true);
      if (player) await player.pause().catch(() => {});
      return;
    }

    lastFingerprint = fp;
    if (!connected) {
      setStatusStable(t("waitConnection"), false);
      return;
    }
    if (!next.vimeo_id) {
      await destroyPlayer();
      setStatusStable(t("connectedIdle"), true);
    }
  }

  async function closeSession() {
    if (!session || session.status === "closed") return;
    await fetch(`${SUPABASE_URL}/rest/v1/tv_sessions?id=eq.${session.id}`, {
      method: "PATCH",
      keepalive: true,
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        Prefer: "return=minimal",
      },
      body: JSON.stringify({ status: "closed" }),
    }).catch(() => {});
  }

  async function fetchLatestSession() {
    if (!session || !session.id) return;
    const { data, error } = await client
      .from("tv_sessions")
      .select("id,pairing_code,vimeo_id,audiotrack,status,user_id,expires_at")
      .eq("id", session.id)
      .maybeSingle();
    if (!error && data) enqueueApply(data);
  }

  function startPolling() {
    if (pollTimer) window.clearInterval(pollTimer);
    pollTimer = window.setInterval(fetchLatestSession, 2000);
  }

  async function start() {
    try {
      session = await createSession();
      codeEl.textContent = session.pairing_code;
      lastStatusText = "";
      lastConnectedClass = false;
      setStatusStable(t("waitConnection"), false);

      channel = client
        .channel(`tv-session-${session.id}`)
        .on("postgres_changes", {
          event: "*",
          schema: "public",
          table: "tv_sessions",
          filter: `id=eq.${session.id}`,
        }, (payload) => {
          if (payload.eventType === "DELETE") {
            lastFingerprint = "";
            setStatusStable(t("closed"), false);
            return;
          }
          enqueueApply(payload.new);
        })
        .subscribe();

      startPolling();
    } catch (error) {
      lastStatusText = "";
      setStatusStable(error && error.message ? error.message : t("unavailable"), false);
    }
  }

  window.addEventListener("beforeunload", closeSession);
  window.addEventListener("pagehide", closeSession);
  window.addEventListener("focus", fetchLatestSession);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) fetchLatestSession();
  });
  start();
})();
</script>
