<!-- HARMONIZER Remote Play TV page. Paste into a WordPress Custom HTML block. -->
<div id="harmonizer-remote-play" class="hrp-shell">
  <div class="hrp-card">
    <div class="hrp-eyebrow">HARMONIZER Remote Play</div>
    <div id="hrp-code" class="hrp-code">....</div>
    <div id="hrp-status" class="hrp-status">Создаём код подключения...</div>
    <div id="hrp-player" class="hrp-player" aria-label="Vimeo player"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://player.vimeo.com/api/player.js"></script>
<script>
(() => {
  const SUPABASE_URL = "https://vsdmphhczmcgfrvbwodp.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_8edV2weU2e0ab__u1vEVFg_MFdt8VeF";

  const codeEl = document.getElementById("hrp-code");
  const statusEl = document.getElementById("hrp-status");
  const playerEl = document.getElementById("hrp-player");
  const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const VIMEO_AUDIO_TRACK = "ru";

  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    realtime: { params: { eventsPerSecond: 3 } },
  });

  let session = null;
  let channel = null;
  let player = null;
  let pollTimer = null;
  let lastVideoKey = null;
  let lastPlayerError = "";

  const MSG_WAIT = "Ожидаем подключение из приложения";
  const MSG_IDLE = "Подключено. Выберите практику в приложении.";
  const MSG_STARTING = "Запускаем видео на ТВ...";
  const MSG_PLAYING = "Видео запущено";
  const MSG_PAUSED = "Пауза";

  let lastStatusText = "";
  let lastConnectedClass = false;
  let lastFingerprint = "";
  let applyChain = Promise.resolve();

  function setStatusStable(text, connected = false) {
    if (text === lastStatusText && connected === lastConnectedClass) return;
    lastStatusText = text;
    lastConnectedClass = connected;
    statusEl.textContent = text;
    statusEl.classList.toggle("hrp-connected", connected);
  }

  function fingerprint(row) {
    return [row.id, row.status, row.vimeo_id ?? "", row.user_id ?? "", row.expires_at].join("\u001f");
  }

  function enqueueApply(next) {
    applyChain = applyChain.then(() => applySessionCore(next)).catch(() => {});
  }

  function randomCode() {
    return Array.from({ length: 4 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join("");
  }

  async function createSession() {
    for (let attempt = 0; attempt < 6; attempt += 1) {
      const pairing_code = randomCode();
      const { data, error } = await client
        .from("tv_sessions")
        .insert({ pairing_code })
        .select("id,pairing_code,vimeo_id,status,user_id,expires_at")
        .single();

      if (!error && data) return data;
      if (!String(error && error.message).includes("duplicate key")) throw error;
    }
    throw new Error("Не удалось создать уникальный код. Обновите страницу.");
  }

  function vimeoEmbedUrl(vimeoId) {
    return `https://player.vimeo.com/video/${encodeURIComponent(vimeoId)}?audiotrack=${encodeURIComponent(VIMEO_AUDIO_TRACK)}`;
  }

  async function destroyPlayer() {
    try {
      if (player && typeof player.destroy === "function") {
        await player.destroy().catch(() => {});
      }
    } finally {
      player = null;
      lastVideoKey = null;
      lastPlayerError = "";
      playerEl.innerHTML = "";
      await sleep(220);
    }
  }

  async function mountPlayerIfNeeded(vimeoId) {
    if (!vimeoId) return false;
    const wantKey = String(vimeoId);
    if (player && lastVideoKey === wantKey) return !lastPlayerError;

    await destroyPlayer();
    const iframe = document.createElement("iframe");
    iframe.src = vimeoEmbedUrl(vimeoId);
    iframe.setAttribute("width", "640");
    iframe.setAttribute("height", "360");
    iframe.setAttribute("title", `Vimeo ${vimeoId}`);
    iframe.setAttribute("allow", "autoplay; fullscreen");
    iframe.setAttribute("allowfullscreen", "");
    iframe.setAttribute("frameborder", "0");
    playerEl.appendChild(iframe);
    player = new Vimeo.Player(iframe);
    lastVideoKey = wantKey;
    player.on("error", (error) => {
      lastPlayerError = error && error.message ? error.message : "Vimeo не разрешил воспроизведение.";
      setStatusStable(`Ошибка Vimeo: ${lastPlayerError}`, true);
    });
    try {
      await player.ready();
      if (lastPlayerError) return false;
      await player.play().catch((error) => {
        lastPlayerError = error && error.message ? error.message : "";
      });
      iframe?.requestFullscreen?.().catch(() => {});
      return !lastPlayerError;
    } catch {
      lastPlayerError = "Проверьте Privacy / Embed domains у этого Vimeo-ролика.";
      setStatusStable(`Ошибка Vimeo: ${lastPlayerError}`, true);
      return false;
    }
  }

  async function applySessionCore(next) {
    if (!next) return;
    const fp = fingerprint(next);
    if (fp === lastFingerprint) return;

    session = next;
    const connected = Boolean(next.user_id);

    if (next.status === "closed" || new Date(next.expires_at).getTime() <= Date.now()) {
      lastFingerprint = fp;
      setStatusStable("Сессия истекла. Обновите страницу, чтобы получить новый код.", false);
      await destroyPlayer();
      return;
    }

    if (next.status === "stopped") {
      lastFingerprint = fp;
      await destroyPlayer();
      setStatusStable(connected ? MSG_IDLE : MSG_WAIT, connected);
      return;
    }

    if (next.status === "playing" && next.vimeo_id) {
      const wantKey = String(next.vimeo_id);
      const already = player && lastVideoKey === wantKey;
      if (!already) setStatusStable(MSG_STARTING, true);
      const mounted = await mountPlayerIfNeeded(next.vimeo_id);
      if (!mounted) {
        lastFingerprint = fp;
        return;
      }
      if (!player || lastVideoKey !== wantKey) return;
      if (already) await player.play().catch(() => {});
      lastFingerprint = fp;
      setStatusStable(MSG_PLAYING, true);
      return;
    }

    if (next.status === "paused" && next.vimeo_id) {
      const wantKey = String(next.vimeo_id);
      const mounted = await mountPlayerIfNeeded(next.vimeo_id);
      if (!mounted) {
        lastFingerprint = fp;
        return;
      }
      if (!player || lastVideoKey !== wantKey) return;
      lastFingerprint = fp;
      setStatusStable(MSG_PAUSED, true);
      if (player) await player.pause().catch(() => {});
      return;
    }

    lastFingerprint = fp;
    if (!connected) {
      setStatusStable(MSG_WAIT, false);
      return;
    }
    if (!next.vimeo_id) {
      await destroyPlayer();
      setStatusStable(MSG_IDLE, true);
    }
  }

  async function closeSession() {
    if (!session || session.status === "closed") return;
    await fetch(`${SUPABASE_URL}/rest/v1/tv_sessions?id=eq.${session.id}`, {
      method: "PATCH",
      keepalive: true,
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        Prefer: "return=minimal",
      },
      body: JSON.stringify({ status: "closed" }),
    }).catch(() => {});
  }

  async function fetchLatestSession() {
    if (!session || !session.id) return;
    const { data, error } = await client
      .from("tv_sessions")
      .select("id,pairing_code,vimeo_id,status,user_id,expires_at")
      .eq("id", session.id)
      .maybeSingle();
    if (!error && data) enqueueApply(data);
  }

  function startPolling() {
    if (pollTimer) window.clearInterval(pollTimer);
    pollTimer = window.setInterval(fetchLatestSession, 2000);
  }

  async function start() {
    try {
      session = await createSession();
      codeEl.textContent = session.pairing_code;
      lastStatusText = "";
      lastConnectedClass = false;
      setStatusStable(MSG_WAIT, false);

      channel = client
        .channel(`tv-session-${session.id}`)
        .on("postgres_changes", {
          event: "*",
          schema: "public",
          table: "tv_sessions",
          filter: `id=eq.${session.id}`,
        }, (payload) => {
          if (payload.eventType === "DELETE") {
            lastFingerprint = "";
            setStatusStable("Сессия закрыта. Обновите страницу, чтобы получить новый код.", false);
            return;
          }
          enqueueApply(payload.new);
        })
        .subscribe();

      startPolling();
    } catch (error) {
      lastStatusText = "";
      setStatusStable(error && error.message ? error.message : "Remote Play недоступен.", false);
    }
  }

  window.addEventListener("beforeunload", closeSession);
  window.addEventListener("pagehide", closeSession);
  window.addEventListener("focus", fetchLatestSession);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) fetchLatestSession();
  });
  start();
})();
</script>

<style>
.hrp-shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.18), transparent 34%), #05070b;
  color: #f8fafc;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.hrp-card {
  width: min(920px, 92vw);
  padding: 48px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 32px;
  background: rgba(15, 23, 42, 0.72);
  text-align: center;
  box-shadow: 0 24px 80px rgba(0,0,0,0.38);
}
.hrp-eyebrow {
  color: #94a3b8;
  font-size: 18px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.hrp-code {
  margin: 24px 0 12px;
  font-size: clamp(82px, 16vw, 180px);
  font-weight: 800;
  letter-spacing: 0.12em;
}
.hrp-status {
  color: #cbd5e1;
  font-size: 24px;
}
.hrp-connected {
  color: #86efac;
}
.hrp-player {
  margin-top: 32px;
  overflow: hidden;
  border-radius: 24px;
  background: #000;
}
.hrp-player iframe {
  width: 100%;
  aspect-ratio: 16 / 9;
  display: block;
}
</style>
