# НЕ установлен на текущем shared-хостинге REG.RU: панель не даёт proxy_pass.
# Живой прокси — deploy/reg-ru-harmonizer-proxy.php на сайте
# harmonizer.zamkovoi.yoga. Этот файл — заготовка для VPS, если PHP-прокси
# когда-нибудь переедет на свой nginx.
#
# Куда вставить на VPS: server { } целиком, не внутрь чужого server.
#
# Если .1 перестанет отвечать, замените IP на другой живой из проверки
# в DEPLOY.md («Russia proxy»): 216.198.79.1, 64.29.17.195, 216.198.79.195.
# Не используйте .3, .67, .131 — с российских сетей на них зависает TLS.

client_max_body_size 128m;

location / {
    proxy_pass https://64.29.17.1;
    proxy_ssl_server_name on;
    proxy_ssl_name harmonizer-ten.vercel.app;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host harmonizer-ten.vercel.app;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Диалог — поток. Без этого телефон ждёт конца ответа несколько минут.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
