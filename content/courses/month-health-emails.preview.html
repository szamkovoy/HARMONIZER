rial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>&amp;nbsp;</font></p><p style=&quot;margin:0;padding:0;word-break:break-word;overflow-wrap:anywhere;font-size:16px !important;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>1. Расписание практик</font></p><p style=&quot;margin:0;padding:0;line-height:1.55;height:1.55em;font-size:16px !important;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>&amp;nbsp;</font></p><p style=&quot;margin:0;padding:0;word-break:break-word;overflow-wrap:anywhere;font-size:16px !important;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>Первый (вводный) урок уже доступен вам в Гармонизаторе на вкладке «День». Чтобы его увидеть, при входе в Гармонизатор, укажите тот же ваш имейл, на который пришло данное письмо. Послезавтра вы получите второй урок - это будет наша первая совместная практика. Через неделю вам придёт вторая практика, ещё через неделю - третья, и через неделю - четвёртая. То есть в течение месяца, помимо вводного урока, вас ожидают четыре инереснейшие практики. Доступ к записям всех этих уроков сохранится у вас в течение трёх месяцев после окончания практикума. Тем не менее, я рекомендую вам проходить уроки не откладывая, так чтобы между практиками была неделя для внутренних трансформаций. Не увеличивайте интервалы между практиками, чтобы они не накапливались, как снежный ком. Наиболее эффективный темп занятий - одна практика в неделю. К тому-же имейте в виду, что первый урок посвящён тому, чтобы вы правильно сформулировали намерение на этот месяц, а также сами для себя определили небольшие дополнительные практики, которые будете выполнять каждый день в течение этого месяца.</font></p><p style=&quot;margin:0;padding:0;line-height:1.55;height:1.55em;font-size:16px !important;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>&amp;nbsp;</font></p><p style=&quot;margin:0;padding:0;word-break:break-word;overflow-wrap:anywhere;font-size:16px !important;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>2. Техника безопасности</font></p><p style=&quot;margin:0;padding:0;line-height:1.55;height:1.55em;font-size:16px !important;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>&amp;nbsp;</font></p><p style=&quot;margin:0;padding:0;word-break:break-word;overflow-wrap:anywhere;font-size:16px !important;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>Я забочусь о вашем здоровье и напоминаю, что только вы несёте ответственность за адекватность выполнения асан, пранаям и медитаций, вашим физическим возможностям и психическому состоянию. Важно понимать, что это онлайн занятия, и я не могу проконтролировать ваше состояние. Практикум ориентирован на людей со средним уровнем физической подготовки. Однако, у вас могут быть физические и психологические особенности. Пожалуйста, будьте внимательны к своему состоянию. Если вы почувствуете, что какая-то асана, которую я предлагаю выполнить, для вас преждевременна, выполните её не очень глубоко, на компромиссном уровне, или вовсе замените другой асаной - такой, которая приблизительно также включает тело, но проще для вас.</font></p><p style=&quot;margin:0;padding:0;line-height:1.55;height:1.55em;font-size:16px !important;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>&amp;nbsp;</font></p><p style=&quot;margin:0;padding:0;word-break:break-word;overflow-wrap:anywhere;font-size:16px !important;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>3. Ответы на вопросы</font></p><p style=&quot;margin:0;padding:0;line-height:1.55;height:1.55em;font-size:16px !important;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>&amp;nbsp;</font></p><p style=&quot;margin:0;padding:0;word-break:break-word;overflow-wrap:anywhere;font-size:16px !important;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>Каждую неделю (обычно по субботам) я провожу в Zoom групповые онлайн-консультации (вебинары), на которых мы общаемся, поддерживаем мотивацию, обсуждаем возникающие трудности и вопросы. Перед каждой такой консультацией я буду высылать вам письмо с указанием даты и времени её проведения, а также ссылкой для того, чтобы к ней присоединиться. То, что интересно вам, наверняка будет интересно и многим другим. Поэтому, обсуждение вопросов на групповых консультациях наиболее эффективно. Если случится так, что время консультации окажется вам неудобным, в этом случае пришлите ваши вопросы имейлом до её начала. Я отвечу на них на консультации, а вам пришлю ссылку на запись, чтобы вы могли посмотреть её в удобное вам время. Записи консультаций сохраняются в течение одной недели.</font></p><p style=&quot;margin:0;padding:0;line-height:1.55;height:1.55em;font-size:16px !important;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>&amp;nbsp;</font></p><p style=&quot;margin:0;padding:0;word-break:break-word;overflow-wrap:anywhere;font-size:16px !important;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>4. Ваши целенаправленные действия - условие изменений</font></p><p style=&quot;margin:0;padding:0;line-height:1.55;height:1.55em;font-size:16px !important;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>&amp;nbsp;</font></p><p style=&quot;margin:0;padding:0;word-break:break-word;overflow-wrap:anywhere;font-size:16px !important;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>Хотя это не программа подготовки космонавтов, всё-таки от вас потребуется некоторая дисциплина и целенаправленные действия. Так устроена эта жизнь, что для получения результатов нужно действовать. В том числе нужно действовать, если вы хотите укрепить здоровье. Так что выполняйте асаны, пранаяму, медитацию, питайтесь тем, что вас исцеляет, корректируйте режим дня, занимайтесь спортом, общайтесь с природой. Каждое своё действие совершайте с целью и с ощущением восстановления целостности и оздоравливания на уровне тела.</font></p><p style=&quot;margin:0;padding:0;line-height:1.55;height:1.55em;font-size:16px !important;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>&amp;nbsp;</font></p><p style=&quot;margin:0;padding:0;word-break:break-word;overflow-wrap:anywhere;font-size:16px !important;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>5. Первый урок</font></p><p style=&quot;margin:0;padding:0;line-height:1.55;height:1.55em;font-size:16px !important;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>&amp;nbsp;</font></p><p style=&quot;margin:0;padding:0;word-break:break-word;overflow-wrap:anywhere;font-size:16px !important;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>А теперь вы готовы перейти к первому уроку. В нём мы рассмотрим тему выработки здоровых привычек, и освоим технику суставной гимнастики, которую я рекомендую вам выполнять ежедневно в течение этого месяца. Урок довольно длинный, так как очень важно правильно сформулировать намерение и продумать небольшую практику на каждый день. Так как этот практикум я проводил в прямом эфире, вы услышите мои комментарии и ответы на задаваемые вопросы. Они помогут вам избежать распространённых ошибок.</font></p><p style=&quot;margin:0;padding:0;line-height:1.55;height:1.55em;font-size:16px !important;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>&amp;nbsp;</font></p><p style=&quot;margin:0;padding:0;word-break:break-word;overflow-wrap:anywhere;font-size:16px !important;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>Урок ждёт вас в Гармонизаторе, на вкладке «День».</font></p><p style=&quot;margin:0;padding:0;line-height:1.55;height:1.55em;font-size:16px !important;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>&amp;nbsp;</font></p><p style=&quot;margin:0;padding:0;word-break:break-word;overflow-wrap:anywhere;font-size:16px !important;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>Желаю вам плодотворных практик!<br>Сергей Замковой</font></p>

flow-wrap:anywhere;font-size:16px !important;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>Урок ждёт вас в Гармонизаторе, на вкладке «День».</font></p><p style=&quot;margin:0;padding:0;line-height:1.55;height:1.55em;font-size:16px !important;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>&amp;nbsp;</font></p><p style=&quot;margin:0;padding:0;word-break:break-word;overflow-wrap:anywhere;font-size:16px !important;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>Я уже много раз замечал, что когда практики переходят некий уровень глубины, им как будто кто-то (что-то) начинает препятствовать. Бывает, интернет пропадает, или в видео какие-то помехи появляются, или звук вдруг отключается, или какие-то посторонние шумы вмешиваются... В данном случае произошло всё перечисленное, кроме помех в изображении. К счастью, камера записала видео, и вы можете выполнить эту практику без препятствий.</font></p><p style=&quot;margin:0;padding:0;line-height:1.55;height:1.55em;font-size:16px !important;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>&amp;nbsp;</font></p><p style=&quot;margin:0;padding:0;word-break:break-word;overflow-wrap:anywhere;font-size:16px !important;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>Кстати, даже с публикацией этого видео возникли затруднения. Так как данный практикум я проводил в виде живых онлайн-занятий, я старался высылать участникам ссылку на запись прпошедшего занятия до окончания текущего дня. Так вот, после проведения данной практики, вечером в отеле отключился интернет. А видеофайл записи очень большой (всё-таки двухчасовая практика). Я решил подождать до утра, но утром мне сказали, что проблема с интернетом наблюдается по всему Самарканду, и она будет решена только через день - в понедельник. Когда же я попытался через мобильный интернет загрузить в Ютюб этот огромный видеофайл, то превысил лимит и загрузка прервалась. После этого я решил поехать к сотовому оператору, но во второй половине воскресенья все салоны связи оказались закрыты. Так вот - подобные приключения происходят довольно часто, когда мы переходим привычный для нас энергетический уровень :)</font></p><p style=&quot;margin:0;padding:0;line-height:1.55;height:1.55em;font-size:16px !important;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>&amp;nbsp;</font></p><p style=&quot;margin:0;padding:0;word-break:break-word;overflow-wrap:anywhere;font-size:16px !important;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>И, честно говоря, не всегда подобные препятствия необходимо столь упорно преодолевать. Если на вашей стороне при выполнении этой практики тоже возникнут затруднения, отложите её на несколько дней.</font></p><p style=&quot;margin:0;padding:0;line-height:1.55;height:1.55em;font-size:16px !important;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>&amp;nbsp;</font></p><p style=&quot;margin:0;padding:0;word-break:break-word;overflow-wrap:anywhere;font-size:16px !important;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetica,sans-serif&quot; size=&quot;3&quot; style=&quot;font-size:16px;line-height:24px;font-family:Arial,Helvetica,sans-serif;&quot;>И я приглашаю вас продолжить совместное движение по пути йоги. Наиболее очевидными направлениями видятся следующие:<br>- Более интенсивно продолжить работу с первой чакрой, и записаться на месячный интенсив &amp;quot;Здоровье&amp;quot; - <a href=&quot;https://zamkovoi.yoga/i1&quot; style=&quot;display:inline-block;max-width:100%;vertical-align:baseline;word-break:normal;overflow-wrap:break-word;word-wrap:break-word;&quot;>https://<wbr>zamkovoi<wbr>.yoga/<wbr>i1</a><br>- Или направить внимание на мягкий и оздоравливающий вход в йогу, записавшись на месячный курс &amp;quot;Йога и Здоровье&amp;quot; - <a href=&quot;https://zamkovoi.yoga/yoga1&quot; style=&quot;display:inline-block;max-width:100%;vertical-align:baseline;word-break:normal;overflow-wrap:break-word;word-wrap:break-word;&quot;>https://<wbr>zamkovoi<wbr>.yoga/<wbr>yoga1</a><br>- Или перейти ко второй чакре, и записаться на практикум &amp;quot;Месяц наслаждений&amp;quot;, чтобы на месяц погрузиться в пространство расслабленности и удовольствия. Ведь вторая чакра включает в нас состояния весёлости, игривости, расслабленности, кайфушности, сексуальности... - <a href=&quot;https://zamkovoi.yoga/m2&quot; style=&quot;display:inline-block;max-width:100%;vertical-align:baseline;word-break:normal;overflow-wrap:break-word;word-wrap:break-word;&quot;>https://<wbr>zamkovoi<wbr>.yoga/<wbr>m2</a></font></p><p style=&quot;margin:0;padding:0;line-height:1.55;height:1.55em;font-size:16px !important;font-family:Arial,Helvetica,sans-serif;&quot;><font face=&quot;Arial,Helvetic
