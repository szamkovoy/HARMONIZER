name: Docs sync

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  docs-sync:
    name: Sync documentation
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-doc-sync]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cursor-agent
        run: curl https://cursor.com/install -fsS | bash

      - name: Add cursor-agent to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure git author (docs bot)
        run: |
          git config user.name "harmonizer-docs-bot"
          git config user.email "harmonizer-docs-bot@users.noreply.github.com"

      - name: Run docs sync
        id: sync
        env:
          GIT_AUTHOR_NAME: harmonizer-docs-bot
          GIT_COMMITTER_NAME: harmonizer-docs-bot
          GIT_AUTHOR_EMAIL: harmonizer-docs-bot@users.noreply.github.com
          GIT_COMMITTER_EMAIL: harmonizer-docs-bot@users.noreply.github.com
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
            if git rev-parse --verify -q "${AFTER}^" >/dev/null; then
              export PUSH_RANGE="$(git rev-parse "${AFTER}^")..$AFTER"
            else
              export PUSH_RANGE="$AFTER..$AFTER"
            fi
          else
            export PUSH_RANGE="$BEFORE..$AFTER"
          fi
          echo "PUSH_RANGE=$PUSH_RANGE"
          HEAD_BEFORE="$(git rev-parse HEAD)"
          bash "$GITHUB_WORKSPACE/scripts/docs-sync/sync.sh"
          HEAD_AFTER="$(git rev-parse HEAD)"
          if [ "$HEAD_BEFORE" != "$HEAD_AFTER" ]; then
            echo "created_commit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push docs updates
        if: steps.sync.outputs.created_commit == 'true'
        run: git push origin "HEAD:main"
