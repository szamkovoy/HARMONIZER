<!-- ============================================================================
  HARMONIZER — Личный кабинет (вставка в WordPress-блок «HTML-код»).

  Деплой: скопировать ВЕСЬ файл в блок HTML на странице https://zamkovoi.yoga/cabinet/
  Открывается только по ссылке из приложения (?ott=…&lang=…&currency=…&ctx=…).
  Прямой заход без токена показывает подсказку «Откройте кабинет из приложения».

  Поток: POST {API}/api/account/session {ott,currency} -> { sessionToken, overview }.
  После оплаты (возврат из Lava) страница обновляет данные:
  GET {API}/api/account/overview?currency=… (Authorization: Bearer sessionToken).

  Покупки (Lava.top):
   - подписка на тариф:        POST /api/account/checkout {kind:"subscription",tier,currency}
   - разовое участие в вебинаре: POST /api/account/checkout {kind:"webinar",webinarId,currency}
   - разовая покупка книги:     POST /api/account/checkout {kind:"book",currency}
  Отмена подписки: DELETE /api/account/subscription.

  Провайдер-абстракция: overview отдаёт purchase.mode = "checkout" (Lava) или
  "link" (задел под российский эквайринг — кнопка становится внешней ссылкой).
  Кабинет не знает провайдера: для "checkout" — POST + redirect на paymentUrl,
  для "link" — window.location = url. Добавление RU-эквайринга = новая ветка в
  resolvePurchaseMode на сервере, без правки кабинета.
============================================================================ -->

  <style>
    #hz-cabinet {
      --hz-teal:#45A29E; --hz-teal-soft:#E3F2F1; --hz-teal-dark:#1F5150;

    #hz-cabinet .hz-user { font-size:16px; line-height:1.5; }
    #hz-cabinet .hz-user .hz-name { font-weight:600; }
    #hz-cabinet .hz-reg { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--hz-muted); margin-top:6px; }
    #hz-cabinet .hz-section { margin-top:40px; }
    #hz-cabinet .hz-section-title { font-size:20px; letter-spacing:.12em; text-transform:uppercase; font-weight:400; padding-bottom:14px; border-bottom:1px solid var(--hz-line); margin-bottom:22px; }
    #hz-cabinet .hz-block { border-left:3px solid var(--hz-teal); padding-left:20px; margin-bottom:28px; }
    #hz-cabinet .hz-block-title { font-size:20px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; margin-bottom:18px; }
    #hz-cabinet .hz-row { margin-bottom:16px; }
    #hz-cabinet .hz-label { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--hz-muted); margin-bottom:4px; font-weight:500; }
    #hz-cabinet .hz-value { font-size:16px; line-height:1.5; }
    #hz-cabinet .hz-pill { display:inline-block; background:var(--hz-teal-soft); color:var(--hz-teal-dark); font-size:11px; letter-spacing:.16em; text-transform:uppercase; padding:3px 12px; border-radius:999px; font-weight:600; margin-left:10px; vertical-align:middle; }
    #hz-cabinet .hz-pill.hz-inactive { background:#F3F4F6; color:var(--hz-muted); }
    #hz-cabinet .hz-cancel { display:inline-block; margin-top:6px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--hz-teal); text-decoration:underline; text-underline-offset:4px; cursor:pointer; background:none; border:0; padding:0; font-family:inherit; }
    #hz-cabinet .hz-cancel:hover { color:var(--hz-teal-dark); }
    #hz-cabinet .hz-plan { margin-bottom:32px; }
    #hz-cabinet .hz-plan-title { font-size:20px; text-transform:uppercase; letter-spacing:.06em; font-weight:600; margin-bottom:12px; }
    #hz-cabinet .hz-plan-sub { font-size:15px; color:var(--hz-muted); margin-bottom:14px; }
    #hz-cabinet ul.hz-bullets { list-style:none; margin:0 0 18px; padding:0; }
    #hz-cabinet ul.hz-bullets li { position:relative; padding-left:28px; margin:10px 0; font-size:16px; line-height:1.5; }
    #hz-cabinet ul.hz-bullets li::before { content:"✓"; position:absolute; left:0; top:0; color:var(--hz-teal); font-weight:700; font-size:16px; }
    #hz-cabinet .hz-btn { display:block; width:100%; padding:13px 18px; border:0; border-radius:10px; background:var(--hz-teal); color:#fff; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
    #hz-cabinet .hz-btn:hover { background:var(--hz-teal-dark); }
    #hz-cabinet .hz-btn:disabled { opacity:.6; cursor:default; }
    #hz-cabinet .hz-btn-ghost { background:transparent; border:1px solid var(--hz-line); color:var(--hz-muted); font-weight:500; }
    #hz-cabinet .hz-select { width:100%; background:transparent; border:0; border-bottom:1px solid var(--hz-line); padding:8px 0; font-size:16px; color:var(--hz-text); font-family:inherit; appearance:none; -webkit-appearance:none; cursor:pointer; margin-bottom:18px; }
    #hz-cabinet .hz-select:focus { outline:0; border-bottom-color:var(--hz-teal); }
    #hz-cabinet .hz-back { text-align:center; color:var(--hz-muted); font-size:13px; margin-top:40px; line-height:1.5; }
    #hz-cabinet .hz-center { text-align:center; padding:48px 20px; }
    #hz-cabinet .hz-spin { width:34px; height:34px; margin:0 auto 14px; border-radius:50%; border:3px solid var(--hz-line); border-top-color:var(--hz-teal); animation:hzspin .9s linear infinite; }
    @keyframes hzspin { to { transform:rotate(360deg); } }
    #hz-cabinet .hz-offer-link { display:inline-block; margin-top:8px; font-size:13px; color:var(--hz-muted); text-decoration:underline; text-underline-offset:4px; cursor:pointer; background:none; border:0; padding:0; font-family:inherit; }
    #hz-cabinet .hz-offer-link:hover { color:var(--hz-teal-dark); }
    #hz-cabinet .hz-modal { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; background:rgba(2,24,39,.55); padding:20px; }
    #hz-cabinet .hz-modal-card { position:relative; width:100%; max-width:560px; max-height:86vh; background:#fff; border-radius:14px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.25); }

    #hz-cabinet .hz-modal-title { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--hz-teal-dark); font-weight:600; }

    "body": "Dieses Dokument ist ein offizielles öffentliches Angebot (öffentliches Angebot) der LLP Sergei Zamkovoi (im Folgenden – „Auftragnehmer“) an jede natürliche Person (im Folgenden – „Nutzer“), die dieses Angebot zu den nachstehenden Bedingungen annimmt.\n\nDie Bezahlung der Dienstleistungen des Auftragnehmers durch den Nutzer auf der Website https://zamkovoi.yoga oder deren Unterseiten stellt die vollständige und vorbehaltlose Annahme (Akzept) der Bedingungen dieses Vertrages dar, was dem Abschluss eines Vertrages zu den darin festgelegten Bedingungen gleichkommt. Im Falle der Nichtzustimmung zu irgendwelchen Bedingungen dieses Dokuments fordert der Auftragnehmer auf, von der Nutzung der angebotenen Dienstleistungen abzusehen.\n\n1. BEGRIFFE UND DEFINITIONEN\n1.1. Der Begriff „Angebot“ bezeichnet das öffentliche Angebot des Auftragnehmers an jede natürliche Person, einen Vertrag zu den in diesem Dokument enthaltenen Bedingungen abzuschließen.\n1.2. Der Begriff „Akzept“ bezeichnet die vollständige und vorbehaltlose Annahme der Vertragsbedingungen durch den Nutzer durch die Bezahlung der Dienstleistungen.\n1.3. Der Begriff „Dienstleistungen“ bezeichnet die individuelle und gruppenbezogene Schulung von Bürgern nach urheberrechtlich geschützten Programmen zur Selbstregulierung, gesunden Lebensweise, praktischen Psychologie und Yoga, einschließlich der Bereitstellung von methodischen Lehrmaterialien, der Erstellung individueller Empfehlungen und Übungspläne sowie der Durchführung regelmäßiger interaktiver Beratungen (Webinare) mit Feedback.\n\n2. VERTRAGSGEGENSTAND\n2.1. Der Auftragnehmer verpflichtet sich, dem Nutzer Bildungs- und Beratungsdienstleistungen zur Schulung in Psychologie, Yoga und Selbstregulierungspraktiken entsprechend dem vom Nutzer gewählten Schulungsprogramm zu erbringen, und der Nutzer verpflichtet sich, diese Dienstleistungen zu bezahlen.\n2.2. Alle Dienstleistungen im Rahmen dieses Vertrages werden vom Auftragnehmer persönlich erbracht. Die Einstellung von angestellten pädagogischen Mitarbeitern erfolgt nicht. Eine Lizenz für Bildungstätigkeit ist gemäß der geltenden Gesetzgebung der Russischen Föderation nicht erforderlich.\n2.3. Der Zugang zur Datenbank mit aufgezeichneten Videomaterialien, Atemtechniken und anderen Techniken sowie zur Lehrliteratur (Büchern) wird dem Nutzer ausschließlich als zusätzliches Bildungs- (methodisches) Hilfsmittel zur Vorbereitung auf die interaktiven Live-Veranstaltungen mit dem Auftragnehmer in Form von Gruppen- oder Einzelberatungen und Webinaren gewährt. Der Zugang zu diesen Materialien kann auf der Website, in Telegram oder in der mobilen App „Harmonizer“ erfolgen, die von den Parteien ausschließlich als technisches Instrument (Nutzerkonto) für den Zugang zu den Materialien und die Erledigung von Aufgaben anerkannt wird.\n\n3. VERFAHREN DER LEISTUNGSERBRINGUNG UND BEZAHLUNG\n3.1. Um die Dienstleistungen zu erhalten, wählt der Nutzer selbstständig das Schulungsprogramm (Kurs, Praktikum, Intensiv, Meisterklasse oder Tarifplan) auf der Website des Auftragnehmers aus, registriert sich und nimmt die Bezahlung vor.\n3.2. Die Bezahlung erfolgt bargeldlos mittels Internet-Acquiring direkt auf der Website des Auftragnehmers.\n3.3. Die Dienstleistungen können im Rahmen eines regelmäßigen monatlichen Abonnements (wiederkehrende Zahlungen) erbracht werden. In diesem Fall erteilt der Nutzer durch die erste Zahlung dem Auftragnehmer und dem Zahlungsdienstleister die Einwilligung zum automatischen monatlichen Abbuchungs des entsprechenden Tarifbetrags von der Bankkarte des Nutzers, bis der Nutzer das Abonnement eigenständig im persönlichen Konto kündigt.\n\n4. SICHERHEITSRICHTLINIE FÜR ZAHLUNGSVORGÄNGE\n4.1. Die Übertragung von Informationen an das Zahlungsgateway erfolgt unter Verwendung der SSL-Verschlüsselungstechnologie über geschlossene Banknetze mit höchstem Sicherheitsniveau. Die Sicherheit der Verarbeitung von Internetzahlungen wird durch den verwendeten Zahlungsdienst gewährleistet. Alle Vorgänge erfolgen gemäß den Anforderungen der Zahlungssysteme.\n4.2. Die vom Nutzer bereitgestellten persönlichen Informationen (E-Mail-Adresse, Bankkartennummer) sind streng vertraulich und dürfen nicht an Dritte weitergegeben werden. Ihre Bankkartendaten werden nur in verschlüsselter Form übertragen und nicht auf dem Server des Auftragnehmers gespeichert.\n\n5. DATENSCHUTZ- UND DATENVERARBEITUNGSRICHTLINIE\n5.1. Mit der Annahme dieses Angebots erteilt der Nutzer dem Auftragnehmer (dem Datenverantwortlichen) seine vorbehaltlose Einwilligung zur Verarbeitung seiner personenbezogenen Daten (Nachname, Vorname, Vatersname, E-Mail-Adresse, Telefonnummer, Geburtsdatum, -zeit und -ort) gemäß dem Bundesgesetz Nr. 152-FZ „Über personenbezogene Daten“.\n5.2. Die Verarbeitung personenbezogener Daten erfolgt ausschließlich zu folgenden Zwecken: Identifizierung des Nutzers, ordnungsgemäße Erfüllung dieses Schulungsvertrags, Versand von organisatorischen Benachrichtigungen und Beantwortung von Fragen des Nutzers im Rahmen des Bildungsprozesses.\n5.3. Der Auftragnehmer verpflichtet sich, die Vertraulichkeit der personenbezogenen Daten des Nutzers zu gewährleisten und die erforderlichen rechtlichen, organisatorischen und technischen Maßnahmen zu ihrem Schutz vor unrechtmäßigem, zufälligem oder unbefugtem Zugriff, Vernichtung, Veränderung oder Kopieren durch Dritte zu ergreifen.\n\n6. HAFTUNG DER PARTEIEN UND MEDIZINISCHE EINSCHRÄNKUNGEN\n6.1. Das Erlernen von Yoga- und Selbstregulierungspraktiken ist mit körperlichen und Atembelastungen verbunden. Der Nutzer bestätigt persönlich, dass er über die Art der Belastungen informiert ist, keine medizinischen Kontraindikationen hat und die volle Verantwortung für seine Gesundheit übernimmt. Die Dienstleistungen des Auftragnehmers stellen keine medizinische Hilfe dar und ersetzen keine ärztlichen Beratungen oder Anordnungen.\n6.2. Die Rückerstattung von Geldern für tatsächlich nicht erbrachte Dienstleistungen erfolgt auf begründeten schriftlichen Antrag des Nutzers, der innerhalb von 14 Kalendertagen nach der Bezahlung an die E-Mail-Adresse des Auftragnehmers zu richten ist. Mit der Gewährung des Zugangs zu den methodischen Materialien des Programms oder der Durchführung eines interaktiven Live-Webinars gilt die Dienstleistung in diesem Umfang als vollständig erbracht und ist nicht erstattungsfähig.\n\n7. STREITBEILEGUNG UND SCHLUSSBESTIMMUNGEN\n7.1. Dieser Vertrag unterliegt dem Recht der Republik Kasachstan und wird nach diesem ausgelegt. Alle Streitigkeiten und Meinungsverschiedenheiten zwischen den Parteien werden durch obligatorische friedliche Verhandlungen beigelegt. Kommt keine Einigung im Rahmen der außergerichtlichen Streitbeilegung zustande (Antwortfrist auf eine Beschwerde: 30 Tage), ist die Streitigkeit gerichtlich am Sitz des Auftragnehmers zu klären.\n7.2. Der Auftragnehmer ist berechtigt, die Bedingungen dieses Vertrages einseitig ohne vorherige Abstimmung mit dem Nutzer zu ändern.\n\n8. ANGABEN ZUM AUFTRAGNEHMER\nLLP Sergei Zamkovoi\nBIN: 220640014056\nAdresse: 130000, Republik Kasachstan, Stadt Aktau, 14. Mikrobezirk, Haus 61\nTel.: +7 707 108 0007\nE-Mail: sergei@zamkovoi.yoga"

éducative n'est requise conformément à la législation en vigueur de la Fédération de Russie.\n2.3. L'accès à la base de matériel vidéo enregistré, aux techniques de respiration et autres, ainsi qu'à la littérature pédagogique (livres) est fourni à l'Utilisateur exclusivement en tant que matériel pédagogique (méthodologique) supplémentaire pour la préparation aux sessions interactives en direct avec le Prestataire sous forme de consultations de groupe ou individuelles et de webinaires. L'accès à ces matériels peut être fourni sur le site Web, sur Telegram ou dans l'application mobile « Harmonizer », reconnue par les Parties comme un simple outil technique (espace utilisateur) pour accéder aux matériels et réaliser les travaux pratiques.\n\n3. MODALITÉS DE FOURNITURE DES SERVICES ET DE PAIEMENT\n3.1. Pour bénéficier des Services, l'Utilisateur choisit indépendamment un Programme de formation (cours, atelier, stage intensif, masterclass ou plan tarifaire) sur le Site du Prestataire, s'inscrit et effectue le paiement.\n3.2. Le paiement est effectué par voie électronique en utilisant le système d'acquisition sur Internet directement sur le Site du Prestataire.\n3.3. Les Services peuvent être fournis sur la base d'un abonnement mensuel régulier (paiements récurrents). Dans ce cas, en effectuant le premier paiement, l'Utilisateur donne au Prestataire et au service de paiement traitant son consentement pour le prélèvement automatique des fonds de la carte bancaire de l'Utilisateur une fois par mois à hauteur du tarif choisi jusqu'à ce que l'Utilisateur résilie lui-même l'abonnement dans son Espace personnel.\n\n4. POLITIQUE DE SÉCURITÉ DES PAIEMENTS\n4.1. La transmission des informations vers la passerelle de paiement s'effectue en utilisant la technologie de chiffrement SSL via des réseaux bancaires fermés offrant le plus haut niveau de fiabilité. La sécurité du traitement des paiements en ligne est garantie par le service de paiement utilisé. Toutes les opérations sont conformes aux exigences des systèmes de paiement.\n4.2. Les informations personnelles fournies par l'Utilisateur (adresse e-mail, numéro de carte bancaire) sont strictement confidentielles et ne sont pas divulguées à des tiers. Les données de votre carte bancaire sont transmises uniquement sous forme cryptée et ne sont pas conservées sur le serveur du Prestataire.\n\n5. POLITIQUE DE CONFIDENTIALITÉ ET DE TRAITEMENT DES DONNÉES PERSONNELLES\n5.1. En acceptant la présente Offre, l'Utilisateur donne son consentement inconditionnel au Prestataire (Responsable du traitement des données) pour le traitement de ses données personnelles (nom, prénom, patronyme, adresse e-mail, numéro de téléphone, date, heure et lieu de naissance) conformément à la Loi fédérale n° 152-FZ « Sur les données personnelles ».\n5.2. Le traitement des données personnelles est effectué exclusivement aux fins suivantes : identification de l'Utilisateur, bonne exécution du présent Contrat de formation, envoi de notifications organisationnelles et réponses aux questions de l'Utilisateur dans le cadre du processus éducatif.\n5.3. Le Prestataire s'engage à garantir la confidentialité des données personnelles de l'Utilisateur et à prendre les mesures juridiques, organisationnelles et techniques nécessaires pour les protéger contre tout accès illégal, accidentel ou non autorisé, toute destruction, modification ou copie par des tiers.\n\n6. RESPONSABILITÉ DES PARTIES ET LIMITATIONS MÉDICALES\n6.1. La formation aux pratiques de yoga et d'autorégulation implique des efforts physiques et respiratoires. L'Utilisateur confirme personnellement qu'il a pris connaissance de la nature des efforts, qu'il ne présente aucune contre-indication médicale et qu'il assume l'entière responsabilité de sa santé. Les Services du Prestataire ne constituent pas une assistance médicale et ne remplacent pas les consultations ou prescriptions d'un médecin.\n6.2. Le remboursement des fonds pour les Services non effectivement rendus est azione vigente della Federazione Russa.\n2.3. L'accesso alla banca dati di materiali video registrati, tecniche di respirazione e altre tecniche, nonché alla letteratura didattica (libri) viene concesso all'Utente esclusivamente come materiale didattico supplementare (metodologico) per la preparazione alle sessioni interattive dal vivo con il Prestatore sotto forma di consulenze di gruppo o individuali e webinar. L'accesso a detti materiali può essere fornito sul sito web, su Telegram, o nell'applicazione mobile «Harmonizer», riconosciuta dalle Parti esclusivamente come strumento tecnico (area utente) per accedere ai materiali e svolgere gli esercizi didattici.\n\n3. MODALITÀ DI EROGAZIONE DEI SERVIZI E PAGAMENTO\n3.1. Per usufruire dei Servizi, l'Utente sceglie autonomamente il Programma di formazione (corso, workshop, intensivo, masterclass o piano tariffario) sul Sito del Prestatore, effettua la registrazione ed esegue il pagamento.\n3.2. Il pagamento viene effettuato in modalità elettronica tramite acquisizione online direttamente sul Sito del Prestatore.\n3.3. I Servizi possono essere forniti in modalità di abbonamento mensile regolare (pagamenti ricorrenti). In tal caso, effettuando il primo pagamento, l'Utente autorizza il Prestatore e il servizio di pagamento incaricato ad addebitare automaticamente i fondi dalla carta bancaria dell'Utente una volta al mese per l'importo della tariffa scelta, fino a quando l'Utente non annulli autonomamente l'abbonamento nell'Area Personale.\n\n4. POLITICA DI SICUREZZA DEI PAGAMENTI\n4.1. Il trasferimento delle informazioni al gateway di pagamento avviene tramite tecnologia di crittografia SSL su reti bancarie chiuse, che offrono il massimo livello di affidabilità. La sicurezza dell'elaborazione dei pagamenti online è garantita dal servizio di pagamento utilizzato. Tutte le operazioni sono conformi ai requisiti dei sistemi di pagamento.\n4.2. Le informazioni personali fornite dall'Utente (e-mail, numero di carta bancaria) sono strettamente confidenziali e non vengono divulgate a terzi. I dati della sua carta bancaria vengono trasmessi solo in forma crittografata e non vengono memorizzati sul server del Prestatore.\n\n5. POLITICA SULLA RISERVATEZZA E TRATTAMENTO DEI DATI PERSONALI\n5.1. Accettando la presente Offerta, l'Utente esprime il proprio consenso incondizionato al Prestatore (Responsabile del trattamento) per il trattamento dei propri dati personali (cognome, nome, patronimico, indirizzo e-mail, numero di telefono, data, orario e luogo di nascita) in conformità con la Legge federale n. 152-FZ «Sui dati personali».\n5.2. Il trattamento dei dati personali viene effettuato esclusivamente per le seguenti finalità: identificazione dell'Utente, corretta esecuzione del presente Contratto di formazione, invio di comunicazioni organizzative e risposte alle domande dell'Utente nell'ambito del processo formativo.\n5.3. Il Prestatore si impegna a garantire la riservatezza dei dati personali dell'Utente e ad adottare le misure legali, organizzative e tecniche necessarie per proteggerli da accessi illegittimi, accidentali o non autorizzati, distruzione, modifica o copiatura da parte di terzi.\n\n6. RESPONSABILITÀ DELLE PARTI E LIMITAZIONI MEDICHE\n6.1. La formazione nelle pratiche di yoga e autoregolazione comporta sforzi fisici e respiratori. L'Utente conferma personalmente di essere a conoscenza della natura degli sforzi, di non avere controindicazioni mediche e si assume la piena responsabilità per la propria salute. I Servizi del Prestatore non costituiscono assistenza medica e non sostituiscono le consulenze o le prescrizioni mediche.\n6.2. Il rimborso dei fondi per i Servizi effettivamente non forniti viene effettuato su richiesta scritta motivata dell'Utente, inviata all'indirizzo e-mail del Prestatore entro 14 giorni di calendario dal pagamento. A partire dal momento in cui viene concesso l'accesso ai materiali metodologici del programma o viene tenuto un webinar interattivo dal vivo,     "body": "El presente documento constituye la oferta pública oficial de LLP Sergei Zamkovoi (en adelante, el \"Prestador de Servicios\") para cualquier persona física (en adelante, el \"Usuario\") que acepte la presente oferta en los términos y condiciones que se indican a continuación.\n\nEl pago por parte del Usuario de los Servicios del Prestador de Servicios en el sitio web https://zamkovoi.yoga o sus páginas de subdominio constituye la aceptación plena e incondicional de los términos y condiciones del presente Contrato, lo que equivale a la celebración del contrato en los términos establecidos en el mismo. En caso de desacuerdo con cualquiera de las condiciones de este documento, el Prestador de Servicios sugiere abstenerse de utilizar los servicios prestados.\n\n1. TÉRMINOS Y DEFINICIONES\n1.1. El término \"Oferta\" significa la propuesta pública del Prestador de Servicios, dirigida a cualquier persona física, para celebrar un contrato en las condiciones contenidas en este documento.\n1.2. El término \"Aceptación\" significa la aceptación plena e incondicional por parte del Usuario de las condiciones del Contrato mediante la realización del pago de los Servicios.\n1.3. El término \"Servicios\" significa la formación individual y grupal de ciudadanos en programas propios de autorregulación, estilo de vida saludable, psicología práctica y yoga, que incluye la provisión de materiales didácticos metodológicos, la elaboración de recomendaciones y planes de estudio individuales, así como la realización de consultas interactivas periódicas (seminarios web) con retroalimentación.\n\n2. OBJETO DEL CONTRATO\n2.1. El Prestador de Servicios se obliga a proporcionar al Usuario servicios de formación y consultoría en psicología, yoga y prácticas de autorregulación de acuerdo con el programa de formación seleccionado por el Usuario, y el Usuario se obliga a pagar estos servicios.\n2.2. Todos los Servicios en virtud del presente Contrato son prestados personalmente por el Prestador de Servicios. No se contrata personal docente. No se requiere licencia para actividades educativas de acuerdo con la legislación vigente de la Federación de Rusia.\n2.3. El acceso a la base de materiales de video grabados, técnicas de respiración y otras, así como a la literatura educativa (libros) se proporciona al Usuario únicamente como material didáctico complementario para la preparación de las sesiones interactivas en vivo con el Prestador de Servicios en formato de consultas grupales o individuales y seminarios web. El acceso a dichos materiales puede proporcionarse en el sitio web, en Telegram o en la aplicación móvil \"Harmonizer\", que las Partes reconocen como una herramienta meramente técnica (panel de usuario) para acceder a los materiales y realizar las tareas de aprendizaje.\n\n3. PROCEDIMIENTO DE PRESTACIÓN DE SERVICIOS Y PAGO\n3.1. Para recibir los Servicios, el Usuario selecciona de forma independiente el Programa de formación (curso, taller, intensivo, clase magistral o plan tarifario) en el Sitio del Prestador de Servicios, se registra y realiza el pago.\n3.2. El pago se realiza mediante transferencia bancaria mediante adquirencia por Internet directamente en el Sitio del Prestador de Servicios.\n3.3. Los Servicios pueden prestarse mediante suscripción mensual periódica (pagos recurrentes). En este caso, al realizar el primer pago, el Usuario otorga al Prestador de Servicios y al servicio de pago asociado su consentimiento para el cargo automático de fondos de la tarjeta bancaria del Usuario una vez al mes por el importe de la tarifa seleccionada hasta que el Usuario cancele la suscripción de forma independiente en el Área Personal.\n\n4. POLÍTICA DE SEGURIDAD EN LOS PAGOS\n4.1. La transmisión de información a la pasarela de pago se realiza mediante tecnología de cifrado SSL a través de redes bancarias cerradas de máxima fiabilidad. La seguridad del procesamiento de los pagos por Internet está garantizada por el servicio de pago utilizado. Todas las operaciones se realizan de acuerdo con los requisitos de los sistemas de pago.\n4.2. La información personal proporcionada por el Usuario (correo electrónico, número de tarjeta bancaria) es estrictamente confidencial y no se divulgará a terceros. Los datos de su tarjeta bancaria se transmiten exclusivamente en forma cifrada y no se almacenan en el servidor del Prestador de Servicios.\n\n5. POLÍTICA DE PRIVACIDAD Y TRATAMIENTO DE DATOS PERSONALES\n5.1. Al aceptar la presente Oferta, el Usuario otorga su consentimiento incondicional al Prestador de Servicios (Responsable del Tratamiento) para el tratamiento de sus datos personales (apellidos, nombre, patronímico, dirección de correo electrónico, número de teléfono, fecha, hora y lugar de nacimiento) de conformidad con la Ley Federal Nº 152-FZ \"Sobre Datos Personales\".\n5.2. El tratamiento de datos personales se realiza exclusivamente con los fines de: identificación del Usuario, correcta ejecución del presente Contrato de formación, envío de notificaciones organizativas y respuestas a las consultas del Usuario en el marco del proceso formativo.\n5.3. El Prestador de Servicios se obliga a garantizar la confidencialidad de los datos personales del Usuario y a adoptar las medidas legales, organizativas y técnicas necesarias para protegerlos del acceso, destrucción, modificación o copia ilícitos, accidentales o no autorizados por parte de terceros.\n\n6. RESPONSABILIDAD DE LAS PARTES Y RESTRICCIONES MÉDICAS\n6.1. La formación en prácticas de yoga y autorregulación está asociada a cargas físicas y respiratorias. El Usuario confirma personalmente que ha sido informado de la naturaleza de las cargas, que no tiene contraindicaciones médicas y que asume plena responsabilidad por su salud. Los servicios del Prestador de Servicios no constituyen asistencia médica y no sustituyen las consultas o prescripciones de un médico.\n6.2. El reembolso de los importes por servicios no prestados efectivamente se realizará previa solicitud motivada por escrito del Usuario, enviada al correo electrónico del Prestador de Servicios en un plazo de 14 días naturales siguientes a la fecha de pago. A partir del momento en que se concede el acceso a los materiales metodológicos del programa o se imparte un seminario web interactivo en vivo, el servicio en esa parte se considerará prestado en su totalidad y no estará sujeto a reembolso.\n\n7. RESOLUCIÓN DE DISPUTAS Y DISPOSICIONES FINALES\n7.1. El presente Contrato se rige e interpreta de conformidad con la legislación vigente de la República de Kazajistán. Todas las disputas y diferencias que surjan entre las Partes se resolverán mediante negociaciones amistosas obligatorias. Si no se llega a un acuerdo durante el procedimiento de solución extrajudicial (plazo de respuesta a la reclamación: 30 días), la disputa se someterá a los tribunales del lugar de registro del Prestador de Servicios.\n7.2. El Prestador de Servicios se reserva el derecho de modificar unilateralmente las condiciones del presente Contrato sin previo acuerdo con el Usuario.\n\n8. DATOS DEL PRESTADOR DE SERVICIOS\nLLP Sergei Zamkovoi\nBIN: 220640014056\nDirección: 130000, República de Kazajistán, ciudad de Aktau, microdistrito 14, casa 61\nTel.: +7 707 108 0007\nCorreo electrónico: sergei@zamkovoi.yoga"

    "body": "O presente documento constitui uma oferta pública oficial (oferta pública) da LLP Sergei Zamkovoi (doravante denominada \"Prestador\") a qualquer pessoa física (doravante denominada \"Usuário\") que aceitar a presente oferta nos termos e condições abaixo especificados.\n\nO pagamento pelo Usuário dos Serviços do Prestador no site https://zamkovoi.yoga ou em suas subpáginas constitui aceitação plena e incondicional (aceitação) das condições do presente Contrato, equivalendo à celebração de um contrato nos termos nele estabelecidos. Em caso de discordância com quaisquer condições do presente documento, o Prestador recomenda que o Usuário se abstenha de utilizar os serviços prestados.\n\n1. TERMOS E DEFINIÇÕES\n1.1. O termo \"Oferta\" designa a proposta pública do Prestador, dirigida a qualquer pessoa física, para celebrar um contrato nos termos constantes do presente documento.\n1.2. O termo \"Aceitação\" designa a aceitação plena e incondicional pelo Usuário das condições do Contrato, mediante o pagamento dos Serviços.\n1.3. O termo \"Serviços\" designa o treinamento individual e em grupo de cidadãos em programas autorais de autorregulação, estilo de vida saudável, psicologia prática e yoga, incluindo o fornecimento de materiais didáticos metodológicos, a elaboração de recomendações e planos de estudo personalizados, bem como a realização de consultas interativas regulares (webinars) com feedback.\n\n2. OBJETO DO CONTRATO\n2.1. O Prestador obriga-se a prestar ao Usuário serviços educacionais e de consultoria no ensino de psicologia, yoga e práticas de autorregulação, de acordo com o programa de treinamento escolhido pelo Usuário, e o Usuário obriga-se a pagar por esses serviços.\n2.2. Todos os Serviços no âmbito do presente Contrato são prestados pessoalmente pelo Prestador. Não se recorre à contratação de professores empregados. Não é exigida licença para atividades educacionais, de acordo com a legislação vigente da Federação Russa.\n2.3. O acesso à base de materiais de vídeo gravados, técnicas de respiração e outras, bem como à literatura educacional (livros), é fornecido ao Usuário exclusivamente como material didático complementar (metodológico) para preparação para as sessões interativas ao vivo com o Prestador, no formato de consultas em grupo ou individuais e webinars. O acesso aos referidos materiais pode ser disponibilizado no website, no Telegram ou no aplicativo móvel \"Harmonizador\", reconhecido pelas Partes exclusivamente como uma ferramenta técnica (painel do usuário) para acesso aos materiais e realização de tarefas de estudo.\n\n3. PROCEDIMENTO DE PRESTAÇÃO DE SERVIÇOS E PAGAMENTO\n3.1. Para receber os Serviços, o Usuário escolhe independentemente o Programa de treinamento (curso, workshop, intensivo, masterclass ou plano tarifário) no Site do Prestador, realiza o registro e efetua o pagamento.\n3.2. O pagamento é efetuado por meios não monetários, utilizando a aquisição pela internet diretamente no Site do Prestador.\n3.3. Os Serviços podem ser fornecidos com base numa assinatura mensal regular (pagamentos recorrentes). Neste caso, ao efetuar o primeiro pagamento, o Usuário concede ao Prestador e ao serviço de pagamento operador o consentimento para o débito automático mensal de fundos do cartão bancário do Usuário no valor da tarifa escolhida, até que a assinatura seja cancelada pelo próprio Usuário no Painel Pessoal.\n\n4. POLÍTICA DE SEGURANÇA DE PAGAMENTOS\n4.1. A transmissão de informações para o gateway de pagamento é realizada utilizando a tecnologia de criptografia SSL através de redes bancárias fechadas, que possuem o mais alto nível de confiabilidade. A segurança do processamento de pagamentos pela Internet é garantida pelo serviço de pagamento utilizado. Todas as operações são realizadas de acordo com os requisitos dos sistemas de pagamento.\n4.2. As informações pessoais fornecidas pelo Usuário (e-mail, número do cartão bancário) são estritamente confidenciais e não são divulgadas a terceiros. Os dados do seu cartão bancário são transmitidos apenas de forma criptografada e não são armazenados no servidor do Prestador.\n\n5. POLÍTICA DE PRIVACIDADE E PROCESSAMENTO DE DADOS PESSOAIS\n5.1. Ao aceitar a presente Oferta, o Usuário concede o seu consentimento incondicional ao Prestador (Operador de dados) para o processamento dos seus dados pessoais (sobrenome, nome, patronímico, endereço de e-mail, número de telefone, data, hora e local de nascimento), em conformidade com a Lei Federal nº 152-FZ \"Sobre Dados Pessoais\".\n5.2. O processamento de dados pessoais é realizado exclusivamente para os fins de: identificação do Usuário, cumprimento adequado do presente Contrato de treinamento, envio de notificações organizacionais e respostas às perguntas do Usuário no âmbito do processo educacional.\n5.3. O Prestador compromete-se a garantir a confidencialidade dos dados pessoais do Usuário e a adotar as medidas legais, organizacionais e técnicas necessárias para protegê-los contra acesso indevido, acidental ou não autorizado, destruição, alteração ou cópia por terceiros.\n\n6. RESPONSABILIDADE DAS PARTES E RESTRIÇÕES MÉDICAS\n6.1. O treinamento em práticas de yoga e autorregulação está associado a esforços físicos e respiratórios. O Usuário confirma pessoalmente que está ciente da natureza dos esforços, não possui contraindicações médicas e assume total responsabilidade pela sua saúde. Os Serviços do Prestador não constituem assistência médica e não substituem consultas ou prescrições médicas.\n6.2. O reembolso dos valores pagos por Serviços efetivamente não prestados será feito mediante solicitação por escrito fundamentada do Usuário, enviada para o e-mail do Prestador no prazo de 14 dias corridos após o pagamento. A partir do momento em que o acesso aos materiais metodológicos do programa for concedido ou um webinar interativo ao vivo for realizado, o serviço nessa parte será considerado integralmente prestado e não será reembolsável.\n\n7. RESOLUÇÃO DE DISPUTAS E DISPOSIÇÕES FINAIS\n7.1. O presente Contrato é regido e interpretado de acordo com a legislação vigente da República do Cazaquistão. Todas as disputas e divergências que surgirem entre as Partes serão resolvidas por meio de negociações amigáveis obrigatórias. Se não houver acordo durante a fase de resolução pré-contenciosa (prazo de resposta à reclamação - 30 dias), a disputa será submetida à apreciação judicial no foro do local de registro do Prestador.\n7.2. O Prestador reserva-se o direito de modificar unilateralmente os termos do presente Contrato sem consentimento prévio do Usuário.\n\n8. DADOS DO PRESTADOR\nLLP Sergei Zamkovoi\nBIN: 220640014056\nEndereço: 130000, República do Cazaquistão, cidade de Aktau, 14º microdistrito, casa 61\nTel.: +7 707 108 0007\nE-mail: sergei@zamkovoi.yoga"

    "body": "Dit document is een officieel openbaar aanbod (openbare aanbieding) van LLP Sergei Zamkovoi (hierna te noemen: \"Opdrachtnemer\") aan elke natuurlijke persoon (hierna te noemen: \"Gebruiker\") die dit aanbod aanvaardt op de hieronder vermelde voorwaarden.\n\nBetaling door de Gebruiker van de Diensten van de Opdrachtnemer op de website https://zamkovoi.yoga of haar subdomeinpagina's geldt als volledige en onvoorwaardelijke aanvaarding (acceptatie) van de voorwaarden van deze Overeenkomst, hetgeen gelijkstaat aan het sluiten van een overeenkomst op de daarin vermelde voorwaarden. In geval van niet-instemming met enige voorwaarde van dit document, stelt de Opdrachtnemer voor om af te zien van het gebruik van de aangeboden diensten.\n\n1. BEGRIPPEN EN DEFINITIES\n1.1. De term \"Aanbieding\" betekent het openbare aanbod van de Opdrachtnemer, gericht aan elke natuurlijke persoon, om een overeenkomst te sluiten op de voorwaarden die in dit document zijn opgenomen.\n1.2. De term \"Aanvaarding\" betekent de volledige en onvoorwaardelijke aanvaarding door de Gebruiker van de voorwaarden van de Overeenkomst door het verrichten van de betaling voor de Diensten.\n1.3. De term \"Diensten\" betekent individuele en groepstraining van burgers volgens de auteursprogramma's op het gebied van zelfregulatie, gezonde levensstijl, praktische psychologie en yoga, met inbegrip van het verstrekken van methodologisch lesmateriaal, het opstellen van individuele aanbevelingen en lesplannen, evenals het geven van regelmatige interactieve consultaties (webinars) met feedback.\n\n2. ONDERWERP VAN DE OVEREENKOMST\n2.1. De Opdrachtnemer verbindt zich ertoe de Gebruiker educatieve en adviserende diensten te verlenen voor opleiding in psychologie, yoga en zelfregulatiepraktijken in overeenstemming met het door de Gebruiker gekozen trainingsprogramma, en de Gebruiker verbindt zich ertoe voor deze diensten te betalen.\n2.2. Alle Diensten in het kader van deze Overeenkomst worden persoonlijk door de Opdrachtnemer verleend. Er wordt geen ingehuurd onderwijzend personeel ingezet. Er is geen vergunning voor educatieve activiteiten vereist overeenkomstig de geldende wetgeving van de Russische Federatie.\n2.3. Toegang tot de database met opgenomen videomateriaal, ademhalings- en andere technieken, evenals tot educatieve literatuur (boeken), wordt de Gebruiker uitsluitend verleend als aanvullend educatief (methodologisch) hulpmiddel ter voorbereiding op live interactieve lessen met de Opdrachtnemer in de vorm van groeps- of individuele consultaties en webinars. Toegang tot deze materialen kan worden verleend op de website, in Telegram, of in de mobiele applicatie \"Harmonizer\", die door de Partijen uitsluitend wordt beschouwd als een technisch hulpmiddel (gebruikersaccount) voor toegang tot materialen en het uitvoeren van educatieve opdrachten.\n\n3. PROCEDURE VOOR HET VERLENEN VAN DIENSTEN EN BETALING\n3.1. Om de Diensten te ontvangen, kiest de Gebruiker zelfstandig het Trainingsprogramma (cursus, practicum, intensive, masterclass of tariefplan) op de Website van de Opdrachtnemer, voltooit de registratie en verricht de betaling.\n3.2. Betaling geschiedt giraal via internetacquisitie rechtstreeks op de Website van de Opdrachtnemer.\n3.3. De Diensten kunnen worden verleend op basis van een regelmatig maandelijks abonnement (terugkerende betalingen). In dat geval geeft de Gebruiker, door de eerste betaling te verrichten, aan de Opdrachtnemer en de betalingsdienst toestemming om automatisch geld van de bankkaart van de Gebruiker af te schrijven, eenmaal per maand ter hoogte van het gekozen tarief, totdat de Gebruiker het abonnement zelfstandig opzegt in de Persoonlijke Account.\n\n4. BELEID INZAKE BETALINGSVEILIGHEID\n4.1. De overdracht van informatie naar de betalingsgateway vindt plaats met behulp van SSL-encryptietechnologie via gesloten banknetwerken met het hoogste betrouwbaarheidsniveau. De veiligheid van de verwerking van internetbetalingen wordt gegarandeerd door de gebruikte betalingsdienst. Alle transacties vinden plaats in overeenstemming met de vereisten van betalingssystemen.\n4.2. De door de Gebruiker verstrekte persoonsgegevens (e-mail, bankkaartnummer) zijn strikt vertrouwelijk en worden niet aan derden bekendgemaakt. Uw bankkaartgegevens worden alleen versleuteld verzonden en worden niet op de server van de Opdrachtnemer opgeslagen.\n\n5. PRIVACYBELEID EN BELEID INZAKE VERWERKING VAN PERSOONSGEGEVENS\n5.1. Door deze Aanbieding te aanvaarden, geeft de Gebruiker zijn onvoorwaardelijke toestemming aan de Opdrachtnemer (Gegevensbeheerder) voor de verwerking van zijn persoonsgegevens (achternaam, voornaam, vadersnaam, e-mailadres, telefoonnummer, geboortedatum, -tijd en -plaats) in overeenstemming met Federale Wet nr. 152-FZ 'Over persoonsgegevens'.\n5.2. De verwerking van persoonsgegevens vindt uitsluitend plaats ten behoeve van: identificatie van de Gebruiker, behoorlijke uitvoering van deze Trainingsovereenkomst, verzending van organisatorische mededelingen en beantwoording van vragen van de Gebruiker in het kader van het educatieve proces.\n5.3. De Opdrachtnemer verbindt zich ertoe de vertrouwelijkheid van de persoonsgegevens van de Gebruiker te waarborgen en de nodige juridische, organisatorische en technische maatregelen te nemen om deze te beschermen tegen onrechtmatige, toevallige of ongeoorloofde toegang, vernietiging, wijziging of kopiëring door derden.\n\n6. VERANTWOORDELIJKHEID VAN DE PARTIJEN EN MEDISCHE BEPERKINGEN\n6.1. Training in yoga- en zelfregulatiepraktijken gaat gepaard met fysieke en ademhalingsbelastingen. De Gebruiker bevestigt persoonlijk dat hij op de hoogte is van de aard van de belastingen, geen medische contra-indicaties heeft en de volledige verantwoordelijkheid voor zijn gezondheid op zich neemt. De Diensten van de Opdrachtnemer vormen geen medische zorg en vervangen niet de consultaties of voorschriften van een arts.\n6.2. Restitutie van gelden voor niet daadwerkelijk verleende Diensten geschiedt op basis van een gemotiveerde schriftelijke aanvraag van de Gebruiker, verzonden naar het e-mailadres van de Opdrachtnemer binnen 14 kalenderdagen na betaling. Vanaf het moment dat toegang tot het methodologisch materiaal van het programma wordt verleend of een live interactief webinar wordt gehouden, wordt de dienst in dat opzicht als volledig verleend beschouwd en komt deze niet in aanmerking voor restitutie.\n\n7. GESCHILLENBESLECHTING EN SLOTBEPALINGEN\n7.1. Deze Overeenkomst wordt beheerst en geïnterpreteerd in overeenstemming met de geldende wetgeving van de Republiek Kazachstan. Alle geschillen en meningsverschillen die tussen de Partijen ontstaan, worden opgelost door middel van verplichte vreedzame onderhandelingen. Indien tijdens de buitengerechtelijke geschillenbeslechting geen overeenstemming wordt bereikt (reactietermijn op een klacht - 30 dagen), wordt het geschil voorgelegd aan de rechtbank op de plaats van registratie van de Opdrachtnemer.\n7.2. De Opdrachtnemer heeft het recht om de voorwaarden van deze Overeenkomst eenzijdig te wijzigen zonder voorafgaande instemming van de Gebruiker.\n\n8. GEGEVENS VAN DE OPDRACHTNEMER\nLLP Sergei Zamkovoi\nBIN: 220640014056\nAdres: 130000, Republiek Kazachstan, stad Aktau, 14e microdistrict, huis 61\nTel.: +7 707 108 0007\nE-mail: sergei@zamkovoi.yoga"
  }

    }
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") refreshOverview();
    });

    function gotoPayment(promise, btn) {
      promise.then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) throw new Error(data && data.error ? data.error : "HTTP " + res.status);
          return data;
        });
      }).then(function (data) {
        if (data.alreadyRegistered) { alert(T.alreadyRegistered); refreshOverview(); return; }
        if (data.paymentUrl) { window.location.href = data.paymentUrl; return; }
        throw new Error("no paymentUrl");
      }).catch(function (err) {
        if (btn) { btn.disabled = false; btn.textContent = btn.getAttribute("data-label") || ""; }
        alert(T.payErr + (err && err.message ? "\n\n(" + err.message + ")" : ""));
      });
    }

    window.hzStartUpgrade = function (tier, purchase, btn) {
      if (purchase && purchase.mode === "link" && purchase.url) { window.location.href = purchase.url; return; }
      if (btn) { btn.disabled = true; btn.textContent = T.redirecting; }
      gotoPayment(apiFetch("/api/account/checkout", {
        method:"POST", body: JSON.stringify({ kind:"subscription", tier: tier, currency: CURRENCY })
      }), btn);
    };

    window.hzStartWebinar = function (purchase, btn) {
      var wid = CTX_WEBINAR_ID || (window.__hzWebinarId || "");
      if (purchase && purchase.mode === "link" && purchase.url) { window.location.href = purchase.url; return; }
      if (btn) { btn.disabled = true; btn.textContent = T.redirecting; }
      var body = { kind:"webinar", currency: CURRENCY };
      if (wid) body.webinarId = wid;
      gotoPayment(apiFetch("/api/account/checkout", { method:"POST", body: JSON.stringify(body) }), btn);
    };

    window.hzStartBook = function (purchase, btn) {
      if (purchase && purchase.mode === "link" && purchase.url) { window.location.href = purchase.url; return; }
      if (btn) { btn.disabled = true; btn.textContent = T.redirecting; }
      gotoPayment(apiFetch("/api/account/checkout", { method:"POST", body: JSON.stringify({ kind:"book", currency: CURRENCY }) }), btn);
    };

    window.hzCancelSub = function (btn) {
      if (!window.confirm(T.subCancelConfirm)) return;
      if (btn) btn.disabled = true;
      apiFetch("/api/account/subscription", { method:"DELETE" })
        .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
        .then(function (data) {
          var until = data.accessUntil ? " " + fmtDate(data.accessUntil) + "." : ".";
          alert(T.subCancelDone + until); refreshOverview();
        })
        .catch(function () { if (btn) btn.disabled = false; alert(T.subCancelErr); });
    };

    window.hzOpenIntensive = function (btn) {
      var sel = document.getElementById("hz-intensive-select");
      var idx = sel ? Number(sel.value) : -1;
      if (isNaN(idx) || idx < 0 || idx >= INTENSIVE_LINKS.length) return;
      window.open(INTENSIVE_LINKS[idx], "_blank");
    };
    var hzOfferState = null;
    function hzOfferEsc(e) { if (e.key === "Escape") hzCloseOffer(); }
    window.hzOpenOffer = function (srcEl) {
      var o = HZ_OFFER[LOCALE_TAG] || HZ_OFFER.ru;
      $("hz-offer-title").textContent = o.link;
      var body = (o.title ? o.title + "\n" : "") + (o.edition ? o.edition + "\n\n" : "") + o.body;
      $("hz-offer-body").textContent = body;
      hzOfferState = { scrollY: window.scrollY, focus: srcEl || document.activeElement };
      $("hz-offer-modal").classList.remove("hz-hidden");
      document.addEventListener("keydown", hzOfferEsc);
    };
    window.hzCloseOffer = function () {
      $("hz-offer-modal").classList.add("hz-hidden");
      document.removeEventListener("keydown", hzOfferEsc);
      var s = hzOfferState; hzOfferState = null;
      if (s) {
        if (typeof s.scrollY === "number") window.scrollTo(0, s.scrollY);
        if (s.focus && typeof s.focus.focus === "function") { try { s.focus.focus({ preventScroll: true }); } catch (e) {} }
      }
    };

  function render(overview) {
      window.__hzWebinarId = (overview.webinar && overview.webinar.webinarId) || "";

      var name = overview.displayName || overview.email || "";
      var tier = overview.tier || "free";
      var isMaster = tier === "master";
      var isPaid = tier !== "free";
      var sub = overview.subscription;
      var html = "";

      /* ── Шапка + пользователь ── */
      html += '<div class="hz-header">';
      html += '<div class="hz-logo1">' + esc(T.logoLine1) + '</div>';
      html += '<div class="hz-logo2">' + esc(T.logoLine2) + '</div>';
      html += '</div>';
      html += '<div class="hz-wrap">';
      html += '<h1 class="hz-title">' + esc(T.cabinetTitle) + '</h1>';
      html += '<div class="hz-user">';
      if (name) html += '<div class="hz-name">' + esc(name) + '</div>';
      if (overview.email) html += '<div class="hz-name" style="font-weight:400;color:var(--hz-muted)">' + esc(overview.email) + '</div>';
      if (overview.registeredAt) html += '<div class="hz-reg">' + esc(T.registeredLabel) + ' ' + esc(fmtDate(overview.registeredAt)) + '</div>';
      html += '</div>';

      /* ── Гармонизатор: текущий тариф/подписка ── */
      html += '<section class="hz-section">';
      html += '<div class="hz-block">';
      html += '<div class="hz-block-title">' + esc(T.harmonizerTitle) + '</div>';

      var tariffValue = "";
      var validUntil = "";
      if (isPaid) {
        tariffValue = T.tiers[tier] || tier;
        validUntil = overview.membershipExpiresAt ? fmtDate(overview.membershipExpiresAt) : "";
      } else if (overview.trialActive) {
        tariffValue = T.demoAccess;
        validUntil = overview.trialExpiresAt ? fmtDate(overview.trialExpiresAt) : "";
      } else {
        tariffValue = T.tiers.free || tier;
      }

      html += '<div class="hz-row"><div class="hz-label">' + esc(T.tariffLabel) + '</div><div class="hz-value">' + esc(tariffValue) + '</div></div>';
      if (validUntil) {
        html += '<div class="hz-row"><div class="hz-label">' + esc(T.validUntilLabel) + '</div><div class="hz-value">' + esc(validUntil) + '</div></div>';
      }

      if (sub) {
        var priceStr = sub.amount != null ? fmtMoney(sub.amount, sub.currency) + T.perMonth : "";
        var active = sub.status === "active";
        html += '<div class="hz-row"><div class="hz-label">' + esc(T.subscriptionLabel) + '</div><div class="hz-value">';
        if (priceStr) html += esc(priceStr) + ' ';
        html += '<span class="hz-pill' + (active ? "" : " hz-inactive") + '">' + esc(active ? T.statusActive : T.statusInactive) + '</span></div></div>';
        if (active && sub.currentPeriodEnd) {
          html += '<div class="hz-row"><div class="hz-label">' + esc(T.nextChargeLabel) + '</div><div class="hz-value">' + esc(fmtDate(sub.currentPeriodEnd)) + '</div></div>';
        } else if (!active && sub.currentPeriodEnd) {
          html += '<div class="hz-row"><div class="hz-label">' + esc(T.accessUntilLabel) + '</div><div class="hz-value">' + esc(fmtDate(sub.currentPeriodEnd)) + '</div></div>';
        }
        if (active) {
          html += '<button class="hz-cancel" onclick="hzCancelSub(this)">' + esc(T.cancelSub) + '</button>';
        }
      }
      html += '</div>';
      html += '</section>';

      /* ── Другие тарифы (скрыто для Мастера) ── */
      if (!isMaster) {
        var upgrades = overview.upgradeTiers || [];
        if (sub && sub.status === "active") {
          upgrades = upgrades.filter(function (u) { return u.tier !== sub.tier; });
        }
        if (upgrades.length) {
          html += '<section class="hz-section">';
          html += '<div class="hz-section-title">' + esc(T.otherTiersTitle) + '</div>';
          upgrades.forEach(function (u) {
            var t = u.tier;
            var purchase = u.purchase || { mode:"checkout", price:null, url:null };
            var desc = (T.tierDesc && T.tierDesc[t]) || [];
            var ptxt = priceText(purchase.price, true);
            var btnLabel = T.activateBtn + (ptxt ? " — " + ptxt : "");
            var subtitle = t === "master" ? T.planOnTopOf.replace("{mentor}", T.tiers.oracle) : T.planIncludes;
            html += '<div class="hz-block hz-plan">';
            html += '<div class="hz-plan-title">' + esc(T.tiers[t] || t) + '</div>';
            html += '<div class="hz-plan-sub">' + esc(subtitle) + '</div>';
            html += '<ul class="hz-bullets">';
            desc.forEach(function (d) { html += '<li>' + esc(d) + '</li>'; });
            html += '</ul>';
            html += '<button class="hz-btn" data-label="' + esc(btnLabel) + '" onclick="hzStartUpgrade(\'' + t + '\', ' + JSON.stringify(purchase).replace(/"/g, "&quot;") + ', this)">' + esc(btnLabel) + '</button>';
            html += '</div>';
          });
          html += '</section>';
        }
      }

      /* ── Дополнительно ── */
      html += '<section class="hz-section">';
      html += '<div class="hz-section-title">' + esc(T.additionalTitle) + '</div>';

      if (!isMaster) {
        var wp = overview.webinar || { webinarId:null, purchase:{ mode:"checkout", price:null, url:null } };
        var hasWebinar = !!(CTX_WEBINAR_ID || wp.webinarId);
        if (hasWebinar) {
          var wprice = priceText(wp.purchase && wp.purchase.price, false);
          var wbtn = T.signUpBtn + (wprice ? " — " + wprice : "");
          html += '<div class="hz-block">';
          html += '<div class="hz-value" style="margin-bottom:16px">' + esc(T.webinarOneTime) + '</div>';
          html += '<button class="hz-btn" data-label="' + esc(wbtn) + '" onclick="hzStartWebinar(' + JSON.stringify(wp.purchase || {}).replace(/"/g, "&quot;") + ', this)">' + esc(wbtn) + '</button>';
          html += '</div>';
        }
      }

      {
        var bp = overview.book || { purchase:{ mode:"checkout", price:null, url:null } };
        var bprice = priceText(bp.purchase && bp.purchase.price, false);
        var bbtn = T.buyBtn + (bprice ? " — " + bprice : "");
        html += '<div class="hz-block">';
        html += '<div class="hz-value" style="margin-bottom:16px">' + esc(T.bookTitle) + '</div>';
        html += '<button class="hz-btn" data-label="' + esc(bbtn) + '" onclick="hzStartBook(' + JSON.stringify(bp.purchase || {}).replace(/"/g, "&quot;") + ', this)">' + esc(bbtn) + '</button>';
        html += '</div>';
      }

      html += '<div class="hz-block">';
      html += '<div class="hz-value" style="margin-bottom:14px">' + esc(T.intensiveTitle) + '</div>';
      html += '<select id="hz-intensive-select" class="hz-select" onchange="var b=document.getElementById(\'hz-int-btn\'); b.disabled=(this.value===\'\');">';
      html += '<option value="">' + esc(T.intensiveChoose) + '</option>';
      (T.intensives || []).forEach(function (label, i) {
        html += '<option value="' + i + '">' + esc(label) + '</option>';
      });
      html += '</select>';
      html += '<button id="hz-int-btn" class="hz-btn" disabled onclick="hzOpenIntensive(this)">' + esc(T.moreBtn) + '</button>';
      html += '</div>';

      html += '</section>';

      html += '<p class="hz-back">© ' + new Date().getFullYear() + ' ' + esc(T.copyrightName) + '</p>';
      html += '<button class="hz-offer-link" onclick="hzOpenOffer(this)">' + esc((HZ_OFFER[LOCALE_TAG] || HZ_OFFER.ru).link) + '</button>';
      html += '</div>';

      $("hz-content").innerHTML = html;
      show("hz-content");

      if (CTX_WEBINAR_ID) {
        var el = document.querySelector("#hz-content .hz-section:last-of-type .hz-block");
        if (el && el.scrollIntoView) { try { el.scrollIntoView({ behavior:"smooth" }); } catch (e) {} }
      }
    }
  $("hz-loading-text").textContent = T.loading;

    var ott = params.get("ott");
    if (!ott) { fail(T.errNoToken); return; }
    try {
      var clean = new URL(window.location.href);
      clean.searchParams.delete("ott");
      window.history.replaceState(null, "", clean.toString());
    } catch (e) {}

    fetch(API_BASE + "/api/account/session", {
      method:"POST",
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify({ ott: ott, currency: CURRENCY })
    })
      .then(function (res) {
        if (res.status === 401) { fail(T.errExpired); return null; }
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        if (!data) return;
        window.__hzSession = data.sessionToken;
        render(data.overview);
      })
      .catch(function () { fail(T.errNetwork); });
  })();
  </script>
</div>
