<!-- ============================================================================
  HARMONIZER — Личный кабинет (вставка в WordPress-блок «HTML-код»).

  Деплой: скопировать ВЕСЬ файл в блок HTML на странице https://zamkovoi.yoga/cabinet/
  Требования: страница открывается только по ссылке из приложения
  (?ott=…&lang=…). Прямой заход без токена показывает подсказку
  «Откройте кабинет из приложения».

  Поток: POST {API}/api/account/session {ott} -> { sessionToken, overview }.
  После оплаты страница обновляет данные: GET {API}/api/account/overview
  (Authorization: Bearer sessionToken).

  Оплата (Lava.top): hzStartUpgrade(tier) -> POST {API}/api/account/checkout
  {tier, currency} -> redirect на paymentUrl Lava. Отмена подписки:
  hzCancelSub() -> DELETE {API}/api/account/subscription. Валюта приходит из
  приложения (?currency=RUB|USD|EUR, по геолокации), контекст — ?ctx=.
============================================================================ -->
<div id="hz-cabinet">
  <style>
    #hz-cabinet { --hz-bg:#12141a; --hz-card:#1a1d26; --hz-border:rgba(255,255,255,.10);
      --hz-text:#f4f4f6; --hz-muted:#9aa0ae; --hz-accent:#7c6cf2; --hz-accent2:#4fd1a5;
      max-width:680px; margin:0 auto; padding:8px 0 40px; color:var(--hz-text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    #hz-cabinet * { box-sizing:border-box; }
    #hz-cabinet .hz-card { background:var(--hz-card); border:1px solid var(--hz-border);
      border-radius:20px; padding:22px; margin-bottom:16px; }
    #hz-cabinet h2 { margin:0 0 6px; font-size:22px; }
    #hz-cabinet h3 { margin:0 0 8px; font-size:17px; }
    #hz-cabinet p { margin:6px 0; line-height:1.5; font-size:15px; }
    #hz-cabinet .hz-muted { color:var(--hz-muted); font-size:13px; }
    #hz-cabinet .hz-badge { display:inline-block; padding:4px 12px; border-radius:999px;
      background:rgba(124,108,242,.16); color:#b9aefc; font-size:13px; font-weight:600; }
    #hz-cabinet .hz-badge.hz-trial { background:rgba(79,209,165,.14); color:var(--hz-accent2); }
    #hz-cabinet .hz-row { display:flex; justify-content:space-between; gap:12px;
      padding:7px 0; border-bottom:1px dashed var(--hz-border); font-size:14px; }
    #hz-cabinet .hz-row:last-child { border-bottom:none; }
    #hz-cabinet ul { margin:8px 0 0; padding-left:20px; }
    #hz-cabinet li { margin:4px 0; font-size:14px; line-height:1.45; }
    #hz-cabinet button.hz-btn { display:block; width:100%; margin-top:14px; padding:12px 18px;
      border:none; border-radius:14px; background:var(--hz-accent); color:#fff;
      font-size:15px; font-weight:600; cursor:pointer; }
    #hz-cabinet button.hz-btn:hover { filter:brightness(1.1); }
    #hz-cabinet button.hz-btn:disabled { opacity:.6; cursor:default; }
    #hz-cabinet button.hz-btn-ghost { background:transparent; border:1px solid var(--hz-border);
      color:var(--hz-muted); font-weight:500; }
    #hz-cabinet .hz-center { text-align:center; padding:44px 20px; }
    #hz-cabinet .hz-spin { width:34px; height:34px; margin:0 auto 14px; border-radius:50%;
      border:3px solid var(--hz-border); border-top-color:var(--hz-accent);
      animation:hzspin .9s linear infinite; }
    @keyframes hzspin { to { transform:rotate(360deg); } }
    #hz-cabinet .hz-hidden { display:none; }
  </style>

      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
      });
    }
    function fmtDate(iso) {
      if (!iso) return "";
      try {
        return new Date(iso).toLocaleDateString(LOCALE_TAG, { year:"numeric", month:"long", day:"numeric" });
      } catch (e) { return iso.slice(0, 10); }
    }

    /* ── Платёжная система Lava.top ────────────────────────────────────────
       Цены дублируют офферы Lava (кабинет автора). При изменении цен в Lava
       обновить и здесь. Валюта выбирается приложением по геолокации и
       приходит в ссылке (?currency=RUB|USD|EUR); по умолчанию EUR. */
    var PRICES = {
      oracle: { RUB: 950, USD: 9.5, EUR: 9.5 },
      master: { RUB: 4950, USD: 99, EUR: 99 }
    };
    var CURRENCY = (params.get("currency") || "EUR").toUpperCase();
    if (CURRENCY !== "RUB" && CURRENCY !== "USD" && CURRENCY !== "EUR") CURRENCY = "EUR";
    /* Контекст перехода из приложения: tier | webinar:<id> | course:<id>.
       Пока используется только tier; webinar/course — задел для следующих
       этапов (страница поднимет соответствующий блок наверх). */
    var CTX = params.get("ctx") || "tier";

    function fmtMoney(amount, currency) {
      try {
        return new Intl.NumberFormat(LOCALE_TAG, {
          style: "currency", currency: currency,
          minimumFractionDigits: amount % 1 ? 2 : 0, maximumFractionDigits: 2
        }).format(amount);
      } catch (e) { return amount + " " + currency; }
    }

    function apiFetch(path, options) {
      options = options || {};
      options.headers = Object.assign(
        { "Content-Type": "application/json", Authorization: "Bearer " + window.__hzSession },
        options.headers || {}
      );
      return fetch(API_BASE + path, options);
    }

    function refreshOverview() {
      if (!window.__hzSession) return;
      apiFetch("/api/account/overview", { method: "GET" })
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (data) { if (data && data.overview) render(data.overview); })
        .catch(function () { /* транзиентно; страница остаётся как есть */ });
    }

    /* Возврат со страницы оплаты Lava: обновляем данные кабинета. */
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") refreshOverview();
    });

    window.hzStartUpgrade = function (tier, btn) {
      if (btn) { btn.disabled = true; btn.textContent = T.redirecting; }
      apiFetch("/api/account/checkout", {
        method: "POST",
        body: JSON.stringify({ tier: tier, currency: CURRENCY })
      })
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (data) {
          if (data.paymentUrl) { window.location.href = data.paymentUrl; return; }
          throw new Error("no paymentUrl");
        })
        .catch(function () {
          if (btn) { btn.disabled = false; btn.textContent = btn.getAttribute("data-label") || ""; }
          alert(T.payErr);
        });
    };

    window.hzCancelSub = function (btn) {
      if (!window.confirm(T.subCancelConfirm)) return;
      if (btn) btn.disabled = true;
      apiFetch("/api/account/subscription", { method: "DELETE" })
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (data) {
          var until = data.accessUntil ? " " + fmtDate(data.accessUntil) + "." : ".";
          alert(T.subCancelDone + until);
          refreshOverview();
        })
        .catch(function () {
          if (btn) btn.disabled = false;
          alert(T.subCancelErr);
        });
    };

    function render(overview) {
      var name = overview.displayName || overview.email || "";
      var tierName = T.tiers[overview.tier] || overview.tier;
      var html = "";

      html += '<div class="hz-card">';
      html += "<h2>" + T.hello + (name ? ", " + esc(name) : "") + "!</h2>";
      if (overview.registeredAt) {
        html += '<p class="hz-muted">' + T.registered + " " + esc(fmtDate(overview.registeredAt)) + "</p>";
      }
      html += '<div class="hz-row"><span>' + T.currentLevel + "</span><span>";
      html += '<span class="hz-badge">' + esc(tierName) + "</span>";
      if (overview.trialActive) html += ' <span class="hz-badge hz-trial">' + T.trialBadge + "</span>";
      html += "</span></div>";
      if (overview.trialActive && overview.trialExpiresAt) {
        html += '<div class="hz-row"><span>' + T.trialUntil + "</span><span>" + esc(fmtDate(overview.trialExpiresAt)) + "</span></div>";
      }
      if (overview.tier !== "free") {
        html += '<div class="hz-row"><span>' + T.paidUntil + "</span><span>" +
          (overview.membershipExpiresAt ? esc(fmtDate(overview.membershipExpiresAt)) : T.unlimited) + "</span></div>";
      }
      html += "</div>";

      /* ── Подписка (Lava): статус, цена, следующий платёж, отмена ── */
      var sub = overview.subscription;
      if (sub) {
        var subTierName = T.tiers[sub.tier] || sub.tier;
        var subPrice = (PRICES[sub.tier] && PRICES[sub.tier][sub.currency] != null)
          ? PRICES[sub.tier][sub.currency]
          : sub.amount;
        html += '<div class="hz-card"><h3>' + T.subTitle + "</h3>";
        html += '<div class="hz-row"><span>' + esc(subTierName) + "</span><span>" +
          '<span class="hz-badge' + (sub.status === "active" ? " hz-trial" : "") + '">' +
          (sub.status === "active" ? T.subActive : T.subCancelled) + "</span></span></div>";
        if (subPrice != null) {
          html += '<div class="hz-row"><span>' + T.subPrice + "</span><span>" +
            esc(fmtMoney(subPrice, sub.currency)) + T.perMonth + "</span></div>";
        }
        if (sub.status === "active" && sub.currentPeriodEnd) {
          html += '<div class="hz-row"><span>' + T.subNextCharge + "</span><span>" +
            esc(fmtDate(sub.currentPeriodEnd)) + "</span></div>";
        }
        if (sub.status === "cancelled" && sub.currentPeriodEnd) {
          html += '<div class="hz-row"><span>' + T.subAccessUntil + "</span><span>" +
            esc(fmtDate(sub.currentPeriodEnd)) + "</span></div>";
        }
        if (sub.status === "active") {
          html += '<button class="hz-btn hz-btn-ghost" onclick="hzCancelSub(this)">' + T.subCancel + "</button>";
        }
        html += "</div>";
      }

      var upgrades = overview.upgradeTiers || [];
      /* При активной подписке не предлагаем уровень, на который она уже оформлена. */
      if (sub && sub.status === "active") {
        upgrades = upgrades.filter(function (t) { return t !== sub.tier; });
      }
      if (upgrades.length) {
        html += '<div class="hz-card"><h3>' + T.upgradesTitle + "</h3>";
        upgrades.forEach(function (tier) {
          var desc = T.tierDesc[tier] || [];
          var price = PRICES[tier] && PRICES[tier][CURRENCY];
          var btnLabel = T.choose + " — " + (T.tiers[tier] || tier) +
            (price != null ? " · " + fmtMoney(price, CURRENCY) + T.perMonth : "");
          html += '<div style="margin-top:14px">';
          html += '<span class="hz-badge">' + esc(T.tiers[tier] || tier) + "</span>";
          if (price != null) {
            html += ' <span class="hz-muted">' + esc(fmtMoney(price, CURRENCY)) + T.perMonth + "</span>";
          }
          html += "<ul>" + desc.map(function (d) { return "<li>" + esc(d) + "</li>"; }).join("") + "</ul>";
          html += '<button class="hz-btn" data-label="' + esc(btnLabel) + '" onclick="hzStartUpgrade(\'' + tier + '\', this)">' + esc(btnLabel) + "</button>";
          html += "</div>";
        });
        if (sub && sub.status === "active") {
          html += '<p class="hz-muted" style="margin-top:12px">' + T.upgradeNote + "</p>";
        }
        html += "</div>";
      } else {
        html += '<div class="hz-card"><p>' + T.topTier + "</p></div>";
      }

      /* ── Курсы / интенсивы (задел следующего этапа) ──────────────────────
         Когда появятся продукты-курсы, наполнить COURSES (id = offerId Lava,
         periodicity ONE_TIME) — блок отрисуется аккордеоном сам. */
      var COURSES = [];
      if (COURSES.length) {
        html += '<div class="hz-card"><h3 id="hz-courses">' + (T.coursesTitle || "") + "</h3>";
        COURSES.forEach(function (course) {
          html += '<div style="margin-top:12px"><span class="hz-badge">' + esc(course.title) + "</span>";
          html += "<p>" + esc(course.summary || "") + "</p>";
          html += '<button class="hz-btn" onclick="hzStartUpgrade(\'' + course.id + '\', this)">' + esc(course.cta || T.choose) + "</button></div>";
        });
        html += "</div>";
      }

      html += '<div class="hz-card"><h3>' + T.webinarTitle + "</h3><p>" +
        (overview.tier === "master" ? T.webinarIncluded : T.webinarBody) + "</p></div>";

      html += '<p class="hz-muted" style="text-align:center">' + T.backToApp + "</p>";

      $("hz-content").innerHTML = html;
      show("hz-content");
    }

    $("hz-loading-text").textContent = T.loading;

    var ott = params.get("ott");
    if (!ott) { fail(T.errNoToken); return; }
    /* Одноразовый токен убираем из адресной строки (история/шаринг URL). */
    try {
      var clean = new URL(window.location.href);
      clean.searchParams.delete("ott");
      window.history.replaceState(null, "", clean.toString());
    } catch (e) { /* не критично */ }

    fetch(API_BASE + "/api/account/session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ott: ott }),
    })
      .then(function (res) {
        if (res.status === 401) { fail(T.errExpired); return null; }
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        if (!data) return;
        /* Токен сессии — только в памяти страницы; пригодится для refresh после оплаты. */
        window.__hzSession = data.sessionToken;
        render(data.overview);
      })
      .catch(function () { fail(T.errNetwork); });
  })();
  </script>
</div>
