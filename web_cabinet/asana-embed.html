<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Asana player</title>
  <style>
    html, body, iframe {
      margin: 0;
      padding: 0;
      border: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body { display: block; }
    #err {
      display: none;
      color: #f8fafc;
      font: 15px/1.4 -apple-system, system-ui, sans-serif;
      padding: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="err"></div>
  <iframe id="v" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  <script src="https://player.vimeo.com/api/player.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var id = (params.get("vimeoId") || params.get("id") || "").trim();
      var track = (params.get("audiotrack") || "ru").trim() || "ru";
      var errEl = document.getElementById("err");
      var iframe = document.getElementById("v");
      var send = function (obj) {
        try {
          if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage(JSON.stringify(obj));
          }
        } catch (e) {}
      };
      if (!id) {
        errEl.style.display = "block";
        errEl.textContent = "Missing Vimeo id.";
        iframe.style.display = "none";
        send({ type: "error", message: "missing_vimeo_id" });
        return;
      }
      iframe.src =
        "https://player.vimeo.com/video/" +
        encodeURIComponent(id) +
        "?audiotrack=" +
        encodeURIComponent(track);

      function pickQuality(p) {
        p.getQualities().then(function (qs) {
          var best = null;
          for (var i = 0; i < qs.length; i++) {
            if (qs[i].id !== "auto" && qs[i].active) {
              best = qs[i];
            }
          }
          if (!best) {
            for (var i = 0; i < qs.length; i++) {
              if (qs[i].id !== "auto") {
                best = qs[i];
                break;
              }
            }
          }
          if (best) {
            p.setCurrentQuality(best.id).catch(function () {});
          }
        }).catch(function () {});
      }

      function attach() {
        if (!window.Vimeo) {
          setTimeout(attach, 80);
          return;
        }
        var p = new Vimeo.Player(iframe);
        p.on("play", function () { send({ type: "play" }); });
        p.on("pause", function () { send({ type: "pause" }); });
        p.on("ended", function () { send({ type: "ended" }); });
        p.on("timeupdate", function (d) {
          if (d && typeof d.seconds === "number") {
            send({ type: "time", seconds: Math.floor(d.seconds) });
          }
        });
        p.on("error", function (e) {
          send({ type: "error", message: (e && e.message) || "vimeo_error" });
        });
        p.on("loaded", function () { send({ type: "loaded" }); });
        p.ready()
          .then(function () {
            // Poster is available — unlock RN overlay before play/quality work.
            send({ type: "loaded" });
            send({ type: "ready" });
            p.getDuration().then(function (d) {
              if (typeof d === "number" && d > 0) {
                send({ type: "duration", seconds: Math.floor(d) });
              }
            }).catch(function () {});
            // Do not await quality before first frame — it delayed the black→poster transition.
            pickQuality(p);
            return p.setVolume(1).catch(function () {});
          })
          .then(function () {
            return p.setMuted(false).catch(function () {});
          })
          .then(function () {
            return p.play();
          })
          .then(function () {
            send({ type: "play" });
          })
          .catch(function () {
            p.setMuted(true).catch(function () {});
            p.play().catch(function () {});
          });
      }
      attach();
    })();
  </script>
</body>
</html>
